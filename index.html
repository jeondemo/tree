    var ki = L.norm(k.ingredient);
    var kw = p.match.some(function (w) { w = L.norm(w); return w && (kn.indexOf(w) >= 0 || ki.indexOf(w) >= 0); });
    if (kw) { out.push({ product: p.name, type: 'alt' }); return; }
    if (p.match.length === 0 && sameIngredient(p.ingredient, k.ingredient)) {
      var samePct = L.pct(p.content) !== null && L.pct(p.content) === L.pct(k.content);
      var sameForm = !!L.norm(p.form) && L.norm(p.form) === L.norm(k.form);
      out.push({ product: p.name, type: samePct && sameForm ? 'alt' : 'similar' });
    }
  });
  return out;
};

L.buildOwn = function (data) {
  var own = {};
  var similar = {};
  var rank = { same: 2, alt: 1 };
  data.kit.forEach(function (k) {
    L.matchKit(k, data.products).forEach(function (m) {
      if (m.type === 'similar') { (similar[m.product] = similar[m.product] || []).push(k); return; }
      var cur = own[m.product];
      if (!cur || rank[m.type] > rank[cur.type]) own[m.product] = { kit: k, type: m.type };
    });
  });
  return { own: own, similar: similar };
};

L.resolve = function (ctx, product) {
  if (!product) return { plan: '', name: '', state: 'none', kit: null };
  var r = ctx.own[product];
  if (!r) return { plan: product, name: product, state: 'buy', kit: null, similar: ctx.similar[product] || [] };
  return { plan: product, name: r.kit.name, state: r.type === 'same' ? 'own' : 'alt', kit: r.kit, similar: [] };
};

L.canonical = function (data, name) {
  if (!name) return '';
  if (data.products.some(function (p) { return p.name === name; })) return name;
  var k = data.kit.filter(function (x) { return x.name === name; })[0];
  if (k) {
    var m = L.matchKit(k, data.products);
    if (m.length) return m[0].product;
  }
  return name;
};

L.productOf = function (data, name) {
  return data.products.filter(function (p) { return p.name === name; })[0] || null;
};

L.doseRow = function (data, tree, names) {
  for (var i = 0; i < names.length; i++) {
    if (!names[i]) continue;
    for (var j = 0; j < data.doses.length; j++) {
      var d = data.doses[j];
      if (d.tree === tree && d.product === names[i]) return d;
    }
  }
  return null;
};

L.fmtAmount = function (v) {
  if (v >= 100) return String(Math.round(v));
  var r = Math.round(v * 10) / 10;
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
};
L.fmtNum = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };

L.doseInfo = function (data, ctx, product, tree, water) {
  var res = L.resolve(ctx, product);
  var p = L.productOf(data, product);
  var row = L.doseRow(data, tree, [res.kit ? res.kit.name : '', product]);
  var unit = (res.kit && res.kit.unit) || (p && p.unit) || '';
  var w = water || 20;
  var line = '';
  if (row && row.dilution) {
    var amt = w * 1000 / row.dilution;
    var exact = Math.abs(amt * 10 - Math.round(amt * 10)) < 1e-9;
    line = '물 ' + w + 'L에 ' + (exact ? '' : '약 ') + L.fmtAmount(amt) + (unit || '') + ' (' + L.fmtNum(row.dilution) + '배)';
  } else if (row && row.doseText) {
    line = row.doseText;
  } else if (p && SPRAY[p.kind]) {
    line = '용량은 라벨 확인';
  }
  return { row: row, unit: unit, line: line, fromLabel: !!(row && row.src === '라벨') };
};

function mdParse(s) {
  var p = String(s || '').split(/[^0-9]+/).filter(Boolean);
  if (p.length < 2) return null;
  var m = +p[p.length - 2], d = +p[p.length - 1];
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return { m: m, d: d };
}

L.window = function (t, season) {
  var s = mdParse(t.s), e = mdParse(t.e);
  if (!s || !e) return null;
  var a = L.dn(season, s.m, Math.min(s.d, L.monthLen(season, s.m)));
  var wrap = (e.m < s.m) || (e.m === s.m && e.d < s.d);
  var ey = wrap ? season + 1 : season;
  var ed = (e.m === 2 && e.d >= 28) ? L.monthLen(ey, 2) : Math.min(e.d, L.monthLen(ey, e.m));
  return { a: a, b: L.dn(ey, e.m, ed) };
};

L.occurrences = function (plan, y, m) {
  var ms = L.dn(y, m, 1), me = L.dn(y, m, L.monthLen(y, m));
  var out = [];
  plan.forEach(function (t) {
    [y - 1, y].forEach(function (season) {
      var w = L.window(t, season);
      if (!w || w.b < ms || w.a > me) return;
      out.push({ task: t, season: season, key: season + ':' + t.id, a: w.a, b: w.b });
    });
  });
  return out;
};

function isSpray(t) { return !!SPRAY[t.kind]; }
function gapBetween(x, y) {
  if (x.tree !== y.tree || !isSpray(x) || !isSpray(y)) return 0;
  if (x.product && x.product === y.product) return 0;
  return Math.max(x.gap || 0, y.gap || 0);
}

L.isHarvest = function (t) { return t.kind === '관리' && /^수확(\.|$)/.test(t.text); };

L.nextHarvest = function (data, tree, afterDn) {
  var o = L.fromDn(afterDn), best = null;
  [o.y - 1, o.y, o.y + 1].forEach(function (season) {
    data.plan.forEach(function (t) {
      if (t.tree !== tree || !L.isHarvest(t)) return;
      var w = L.window(t, season);
      if (!w || w.a <= afterDn || w.a - afterDn > 150) return;
      if (best === null || w.a < best) best = w.a;
    });
  });
  return best;
};

L.harvestOpen = function (data, tree, lo, hi) {
  var o = L.fromDn(lo), hit = false;
  [o.y - 1, o.y].forEach(function (season) {
    data.plan.forEach(function (t) {
      if (t.tree !== tree || !L.isHarvest(t)) return;
      var w = L.window(t, season);
      if (w && w.a <= lo && w.b >= lo) hit = true;
    });
  });
  return hit;
};

L.taskOfKey = function (data, key) {
  var id = String(key || '').split(':')[1] || '';
  return data.plan.filter(function (t) { return t.id === id; })[0] || null;
};

L.treeOrder = function (data) {
  var o = {};
  data.trees.forEach(function (t, i) { o[t.name] = i; });
  return o;
};

L.monthPlan = function (data, ctx, today, y, m, keep) {
  var ms = L.dn(y, m, 1), me = L.dn(y, m, L.monthLen(y, m));
  var isCurrent = today >= ms && today <= me;
  var from = isCurrent ? today : ms;
  var checks = {};
  data.checks.forEach(function (c) { checks[c.id] = c.date || 'done'; });
  var order = L.treeOrder(data);
  var res = { visits: [], routine: [], notices: [], skip: [], overdue: [], done: [], later: [], ms: ms, me: me, isCurrent: isCurrent };
  var pend = [];
  var gapOf = {};
  data.products.forEach(function (p) { gapOf[p.name] = p.gap || 0; });
  var logs = data.logs.map(function (g) {
    return { dn: L.isoToDn(g.date), tree: g.tree, base: g.base || L.canonical(data, g.product), product: g.product };
  }).filter(function (g) { return g.dn !== null; });

  L.occurrences(data.plan, y, m).forEach(function (o) {
    o.doneDate = checks[o.key] || '';
    if (o.task.kind === '주의') { res.notices.push(o); return; }
    if (o.task.routine) { res.routine.push(o); return; }
    if (o.doneDate && !(keep && keep[o.key])) { res.done.push(o); return; }
    if (o.b < from) { res.overdue.push(o); return; }
    o.lo = Math.max(o.a, from);
    o.hi = Math.min(o.b, me);
    o.defer = o.b > me;
    o.wait = null;
    if (isSpray(o.task) && o.task.product && !o.task.post) {
      var own0 = ctx.own[o.task.product];
      var drow = L.doseRow(data, o.task.tree, [own0 ? own0.kit.name : '', o.task.product]);
      if (drow && drow.phi !== null && drow.phi >= 7) {
        o.inHarvest = L.harvestOpen(data, o.task.tree, o.lo, o.hi);
        o.phiDays = drow.phi;
        var hs = L.nextHarvest(data, o.task.tree, o.a);
        if (hs !== null && hs - drow.phi < o.b) {
          o.phiCap = hs - drow.phi; o.harvestAt = hs; o.phiDays = drow.phi;
          if (o.phiCap - o.lo + 1 < 5) { o.phiPast = o.phiCap < from; res.skip.push(o); return; }
          o.hi = Math.min(o.hi, o.phiCap);
          if (o.phiCap <= me) o.defer = false;
        }
      }
    }
    if (isSpray(o.task)) {
      logs.forEach(function (g) {
        if (g.tree !== o.task.tree) return;
        if (o.task.product && g.base === o.task.product) return;
        var gap = Math.max(o.task.gap || 0, gapOf[g.base] || 0);
        if (!gap) return;
        if (g.dn > o.b || g.dn < o.lo - gap) return;
        var need = g.dn + gap;
        if (need > o.lo) { o.lo = need; o.wait = { until: need, product: g.product, date: g.dn, gap: gap }; }
      });
    }
    if (o.lo > o.hi) {
      if (o.b >= o.lo) { o.defer = true; res.later.push(o); return; }
      o.hi = o.lo; o.tight = true;
      if (o.lo > me) { res.later.push(o); return; }
    }
    pend.push(o);
  });

  pend.forEach(function (x) {
    pend.forEach(function (yy) {
      if (x === yy) return;
      var g = gapBetween(x.task, yy.task);
      if (!g) return;
      if (yy.b > x.b || (yy.b === x.b && (yy.task.gap || 0) > (x.task.gap || 0))) {
        var cap = Math.min(yy.b, me + 31) - g;
        if (cap >= x.lo && cap < x.hi) { x.hi = cap; x.capped = true; }
      }
    });
  });

  var must = pend.filter(function (o) { return !o.defer; });
  var opt = pend.filter(function (o) { return o.defer; });
  must.sort(function (p, q) { return (p.hi - q.hi) || (q.lo - p.lo); });
  var visits = [];
  must.forEach(function (o) {
    var lo = o.lo;
    var pushedBy = null;
    visits.forEach(function (v) {
      v.items.forEach(function (it) {
        var g = gapBetween(o.task, it.task);
        if (g && v.lo + g > lo) { lo = v.lo + g; pushedBy = v; o.gapDays = g; }
      });
    });
    var hi = o.hi;
    if (lo > hi) {
      if (o.b >= lo && lo <= me) { hi = Math.min(o.b, me); }
      else if (lo > me) { o.defer = true; o.pushed = true; res.later.push(o); return; }
      else { hi = lo; o.tight = true; }
    }
    var home = null, bestSpan = -1, homeFree = false;
    visits.forEach(function (v) {
      var clash = v.items.some(function (it) { return gapBetween(o.task, it.task) > 0; });
      if (clash) return;
      var nl = Math.max(v.lo, lo), nh = Math.min(v.hi, hi);
      if (nl > nh) return;
      var span = nh - nl + 1;
      var free = nl === v.lo && nh === v.hi;
      if (!free && span < Math.min(5, hi - lo + 1, v.hi - v.lo + 1)) return;
      if (free) {
        if (!homeFree || v.lo < home.lo) { home = v; homeFree = true; }
      } else if (!homeFree && span > bestSpan) { home = v; bestSpan = span; }
    });
    if (home) {
      home.lo = Math.max(home.lo, lo);
      home.hi = Math.min(home.hi, hi);
      home.items.push(o);
      if (pushedBy && !home.after) { home.after = pushedBy; home.gapDays = o.gapDays; }
    } else {
      visits.push({ lo: lo, hi: hi, items: [o], after: pushedBy, gapDays: pushedBy ? o.gapDays : 0 });
    }
  });
  visits.sort(function (p, q) { return (p.lo - q.lo) || (p.hi - q.hi); });
  visits.forEach(function (v) {
    if (v.after && v.after.hi >= v.lo && v.lo - 1 >= v.after.lo) v.after.hi = v.lo - 1;
  });
  opt.forEach(function (o) {
    var home = null;
    for (var i = 0; i < visits.length && !home; i++) {
      var v = visits[i];
      var clash = v.items.some(function (it) { return gapBetween(o.task, it.task) > 0; });
      if (!clash && o.lo <= v.lo && o.hi >= v.hi) home = v;
    }
    if (home) home.items.push(o); else res.later.push(o);
  });
  function byTree(p, q) {
    return ((order[p.task.tree] || 0) - (order[q.task.tree] || 0)) || (p.a - q.a) || (p.task.id < q.task.id ? -1 : 1);
  }
  visits.forEach(function (v, i) { v.items.sort(byTree); v.n = i + 1; });
  ['routine', 'notices', 'skip', 'overdue', 'done', 'later'].forEach(function (k) { res[k].sort(byTree); });
  res.visits = visits;

  var active = [];
  visits.forEach(function (v) { v.items.forEach(function (o) { active.push(o); }); });
  var prodSeen = {}, prods = [];
  active.concat(res.later, res.overdue).forEach(function (o) {
    var p = o.task.product;
    if (!p || prodSeen[p]) return;
    prodSeen[p] = 1;
    prods.push(L.resolve(ctx, p));
  });
  var rk = { own: 0, alt: 0, buy: 1 };
  prods.sort(function (p, q) { return rk[p.state] - rk[q.state]; });
  res.products = prods;
  res.taskCount = active.filter(function (o) { return !o.doneDate; }).length;
  res.buyCount = prods.filter(function (p) { return p.state === 'buy'; }).length;
  return res;
};

L.rangeText = function (lo, hi, today) {
  if (lo <= today) return L.md(hi) + '까지';
  var a = L.fromDn(lo), b = L.fromDn(hi);
  if (lo === hi) return L.md(lo);
  if (a.m === b.m) return a.m + '월 ' + a.d + '일부터 ' + b.d + '일까지';
  return L.md(lo) + '부터 ' + L.md(hi) + '까지';
};

L.treeFolds = function (data, ctx, mp, today) {
  var by = {};
  data.trees.forEach(function (t) { by[t.name] = { tree: t.name, items: [], routine: [], notices: [] }; });
  function add(o, cat, visit) {
    var f = by[o.task.tree];
    if (f) f.items.push({ o: o, cat: cat, visit: visit || 0 });
  }
  mp.visits.forEach(function (v) { v.items.forEach(function (o) { add(o, 'visit', v.n); }); });
  mp.later.forEach(function (o) { add(o, 'later'); });
  mp.overdue.forEach(function (o) { add(o, 'late'); });
  mp.skip.forEach(function (o) { add(o, 'skip'); });
  mp.done.forEach(function (o) { add(o, 'done'); });
  mp.routine.forEach(function (o) { var f = by[o.task.tree]; if (f && f.routine.indexOf(o.task.text) < 0) f.routine.push(o.task.text); });
  mp.notices.forEach(function (o) { var f = by[o.task.tree]; if (f && f.notices.indexOf(o.task.text) < 0) f.notices.push(o.task.text); });
  var mo = L.fromDn(mp.ms);
  var ym = mo.y + '-' + pad(mo.m);
  return data.trees.map(function (t) {
    var f = by[t.name];
    f.items.sort(function (p, q) { return (p.o.a - q.o.a) || (p.o.task.id < q.o.task.id ? -1 : 1); });
    var monthKeys = {};
    f.items.forEach(function (x) { monthKeys[x.o.key] = 1; });
    f.parts = data.logs.filter(function (g) {
      return g.tree === t.name && String(g.date).slice(0, 7) === ym && !(g.key && monthKeys[g.key]);
    }).map(function (g) {
      var d = L.isoToDn(g.date);
      return { id: g.id, date: g.date, day: d === null ? '' : L.fromDn(d).d, product: g.product, water: g.water };
    }).sort(function (p, q) { return p.date < q.date ? -1 : p.date > q.date ? 1 : 0; });
    f.month = mo.m;
    f.partText = f.parts.length ? mo.m + '/' + f.parts[0].day + ' ' + f.parts[0].product + (f.parts.length > 1 ? ' 외 ' + (f.parts.length - 1) + '건' : '') : '';
    var sprays = f.items.filter(function (x) { return isSpray(x.o.task) && !(x.cat === 'skip' && x.o.phiPast && !x.o.doneDate); });
    var pendS = sprays.filter(function (x) { return !x.o.doneDate; });
    var pendC = f.items.filter(function (x) { return !isSpray(x.o.task) && !x.o.doneDate; });
    f.late = f.items.some(function (x) { return x.cat === 'late' && !x.o.doneDate; });
    f.buy = pendS.some(function (x) { return x.o.task.product && L.resolve(ctx, x.o.task.product).state === 'buy'; });
    f.left = pendS.length + pendC.length;
    if (pendS.length) {
      f.status = 'plan';
      var names = [];
      pendS.forEach(function (x) {
        var n = x.o.task.product ? L.resolve(ctx, x.o.task.product).name : x.o.task.text;
        if (names.indexOf(n) < 0) names.push(n);
      });
      var timed = pendS.filter(function (x) { return x.o.lo !== undefined && x.cat !== 'late'; }).sort(function (p, q) { return p.o.lo - q.o.lo; });
      var first = timed.length ? timed[0].o : null;
      var when = first ? L.rangeText(first.lo, first.defer ? first.b : first.hi, today) : '기간이 지났습니다';
      f.sub = names.slice(0, 2).join(', ') + (names.length > 2 ? ' 외 ' + (names.length - 2) + '가지' : '') + ' · ' + when;
    } else if (sprays.length) {
      f.status = 'done';
      f.sub = pendC.length ? '관리 ' + pendC.length + '가지 남음 · ' + pendC[0].o.task.text : '이달 할 일을 모두 끝냈습니다';
    } else if (f.items.length || f.routine.length || f.notices.length) {
      f.status = 'care';
      f.sub = pendC.length ? pendC[0].o.task.text + (pendC.length > 1 ? ' 외 ' + (pendC.length - 1) + '가지' : '') : (f.items.length ? '이달 할 일을 모두 끝냈습니다' : (f.routine[0] || f.notices[0]));
    } else {
      f.status = 'none';
      f.sub = '이달에는 할 일이 없습니다';
    }
    return f;
  });
};

L.groupByTree = function (items) {
  var out = [], idx = {};
  items.forEach(function (o) {
    var t = o.task.tree;
    if (idx[t] === undefined) { idx[t] = out.length; out.push({ tree: t, items: [] }); }
    out[idx[t]].items.push(o);
  });
  return out;
};

L.groupRoutine = function (items) {
  var out = [], idx = {};
  items.forEach(function (o) {
    var k = o.task.text;
    if (idx[k] === undefined) { idx[k] = out.length; out.push({ text: k, trees: [] }); }
    if (out[idx[k]].trees.indexOf(o.task.tree) < 0) out[idx[k]].trees.push(o.task.tree);
  });
  return out;
};

L.mixVerdict = function (data, a, b) {
  if (a === b) return null;
  var hit = null;
  data.mix.forEach(function (r) {
    if ((r.a === a && r.b === b) || (r.a === b && r.b === a)) hit = r;
  });
  if (hit) return hit;
  data.mix.forEach(function (r) {
    if (!hit && r.b === '*' && (r.a === a || r.a === b)) hit = r;
  });
  if (hit) return hit;
  return { a: a, b: b, verdict: '확인 안 됨', note: '라벨의 혼용표 확인. 모르면 따로 뿌리기' };
};

L.mixLines = function (data, ctx, items) {
  var names = [];
  items.forEach(function (o) {
    if (isSpray(o.task) && o.task.product && !o.doneDate && names.indexOf(o.task.product) < 0) names.push(o.task.product);
  });
  var out = [];
  for (var i = 0; i < names.length; i++) {
    for (var j = i + 1; j < names.length; j++) {
      var v = L.mixVerdict(data, names[i], names[j]);
      if (v) out.push({ a: L.resolve(ctx, names[i]).name, b: L.resolve(ctx, names[j]).name, verdict: v.verdict, note: v.note });
    }
  }
  return out;
};

L.usage = function (data, tree, base, year) {
  var n = 0;
  data.logs.forEach(function (g) {
    if (g.tree !== tree) return;
    if ((g.base || L.canonical(data, g.product)) !== base) return;
    if (String(g.date).slice(0, 4) !== String(year)) return;
    n++;
  });
  return n;
};

L.upcoming = function (data, today, months) {
  var o = L.fromDn(today);
  var seen = {}, out = [];
  for (var i = 0; i < (months || 12); i++) {
    var y = o.y + Math.floor((o.m - 1 + i) / 12), m = (o.m - 1 + i) % 12 + 1;
    L.occurrences(data.plan, y, m).forEach(function (oc) {
      if (seen[oc.key] || oc.b < today) return;
      seen[oc.key] = 1;
      out.push(oc);
    });
  }
  out.sort(function (p, q) { return (p.a - q.a) || (p.b - q.b); });
  return out;
};

L.yearGrid = function (data, today) {
  var cur = L.fromDn(today);
  var checks = {};
  data.checks.forEach(function (c) { checks[c.id] = c.date || 'done'; });
  var rows = [];
  for (var m = 1; m <= 12; m++) {
    var y = cur.y;
    var occ = L.occurrences(data.plan, y, m);
    var ym = y + '-' + pad(m);
    var cells = data.trees.map(function (t) {
      var items = occ.filter(function (o) { return o.task.tree === t.name; });
      items.forEach(function (o) { o.doneDate = checks[o.key] || ''; });
      items.sort(function (p, q) { return (p.a - q.a) || (p.task.id < q.task.id ? -1 : 1); });
      var has = function (kinds) { return items.some(function (o) { return kinds.indexOf(o.task.kind) >= 0; }); };
      var sprays = data.logs.filter(function (g) { return g.tree === t.name && String(g.date).slice(0, 7) === ym; }).map(function (g) {

      });
      sprays.sort(function (p, q) { return p.date < q.date ? -1 : p.date > q.date ? 1 : 0; });
      return { tree: t.name, items: items, sprays: sprays, f: has(['살균']), b: has(['살충']), o: has(['동계']), c: has(['관리', '도포', '주의']) };
    });

};

L.yearText = function (ctx, items) {
  var groups = [['동계', ['동계']], ['살균', ['살균']], ['살충', ['살충']], ['관리', ['관리', '도포']], ['주의', ['주의']]];
  var out = [];

    var lines = [];
    items.forEach(function (o) {

L.monthList = function (today, count) {
  var o = L.fromDn(today), out = [];
  for (var i = 0; i < (count || 12); i++) {
    out.push({ y: o.y + Math.floor((o.m - 1 + i) / 12), m: (o.m - 1 + i) % 12 + 1 });
  }
  return out;
};

L.nextUse = function (data, today) {
  var map = {};
  L.upcoming(data, today, 12).forEach(function (oc) {
    var p = oc.task.product;
    if (!p) return;
    if (!map[p]) {
      var st = L.fromDn(Math.max(oc.a, today)), now = L.fromDn(today);
      map[p] = { a: oc.a, label: oc.task.label, when: (st.y !== now.y ? '내년 ' : '') + st.m + '월', trees: [] };
    }
    if (oc.a <= map[p].a + 31 && map[p].trees.indexOf(oc.task.tree) < 0) map[p].trees.push(oc.task.tree);

L.kitView = function (data, ctx, today) {
  var next = L.nextUse(data, today);
  var photoCount = {};
  data.photos.forEach(function (p) { photoCount[p.kitId] = (photoCount[p.kitId] || 0) + 1; });
  var owned = data.kit.map(function (k) {
    var ms = L.matchKit(k, data.products);
    var used = ms.filter(function (x) { return x.type !== 'similar'; });
    var sim = ms.filter(function (x) { return x.type === 'similar'; });
    var alt = used.some(function (x) { return x.type === 'alt'; });
    var use = '';
    if (alt) use = '계획의 ' + used.map(function (x) { return x.product; }).join(', ') + ' 대신 들어감';
    else if (used.length && next[used[0].product]) use = '다음 사용: ' + next[used[0].product].when + ' · ' + next[used[0].product].trees.join(', ');
    else if (sim.length) use = L.josa(sim[0].product, '과', '와') + ' 성분이 같지만 함량이나 제형이 다름. 라벨로 용량 확인 필요';
    else if (!used.length) use = '지금 계획에는 쓰이지 않음';
    var meta = [k.ingredient, k.content, k.form].filter(Boolean).join(' · ');
    var n = photoCount[k.id] || 0;
    var checked = (n ? '사진 ' + n + '장' : '사진 없음') + ' · ' + (k.status === '확인함' ? '용량과 용법 확인함' : '확인 전');
    return { kit: k, alt: alt, similar: sim.length > 0 && !used.length, use: use, meta: meta, checked: checked, photos: n };
  });
  var need = data.products.filter(function (p) { return !ctx.own[p.name] && next[p.name]; }).map(function (p) {
    var nx = next[p.name];
    return {
      product: p,
      meta: [p.kind, p.ingredient !== p.name ? p.ingredient : ''].filter(Boolean).join(' · '),
      use: '다음 사용: ' + nx.when + ' · ' + nx.trees.join(', '),
      a: nx.a,
      similar: (ctx.similar[p.name] || []).map(function (k) { return k.name; })
    };
  });

L.treeOfCrop = function (trees, crop) {
  var raw = String(crop || '');
  var parts = [raw.replace(/\(.*?\)/g, '')].concat((raw.match(/\((.*?)\)/g) || []).map(function (s) { return s.slice(1, -1); }));
  var cands = [];
  parts.forEach(function (p) { p.split(/[,·\/]/).forEach(function (q) { if (L.norm(q)) cands.push(L.norm(q)); }); });
  for (var i = 0; i < trees.length; i++) {
    for (var j = 0; j < trees[i].aliases.length; j++) {
      if (cands.indexOf(L.norm(trees[i].aliases[j])) >= 0) return trees[i].name;
    }
  }
  return '';
};

function mergeRows(rows) {
  if (!rows.length) return null;
  var out = { target: [], dilution: null, doseText: '', phi: null, max: null, phiNote: '', source: '' };
  rows.forEach(function (r) {
    var t = trim(r.target);
    if (t && out.target.indexOf(t) < 0) out.target.push(t);
    var d = num(r.dilution), p = num(r.phi), mx = num(r.max);
    if (d !== null && out.dilution === null) out.dilution = d;
    if (!out.doseText && trim(r.doseText)) out.doseText = trim(r.doseText);
    if (p !== null) out.phi = out.phi === null ? p : Math.max(out.phi, p);
    if (mx !== null) out.max = out.max === null ? mx : Math.min(out.max, mx);
    if (!out.phiNote && trim(r.phiText) && p === null) out.phiNote = trim(r.phiText);
    if (!out.source && trim(r.source)) out.source = trim(r.source);
  });
  out.target = out.target.join(', ');
  return out;
}

function verdict(lab, base) {
  if (lab === null || lab === undefined) return (base === null || base === undefined) ? 'none' : 'keep';
  if (base === null || base === undefined) return 'new';
  return lab === base ? 'same' : 'diff';
}
L.verdict = verdict;

L.compareLabel = function (data, label, search) {
  label = label || {};
  var ident = { name: trim(label.name), ingredient: trim(label.ingredient), content: trim(label.content), form: trim(label.form), covers: '' };
  var matches = L.matchKit(ident, data.products);
  var base = matches.length ? matches[0].product : '';
  var rows = [];
  data.trees.forEach(function (t) {
    var lab = mergeRows((label.rows || []).filter(function (r) { return L.treeOfCrop(data.trees, r.crop) === t.name; }));
    var sr = mergeRows(((search && search.rows) || []).filter(function (r) { return L.treeOfCrop(data.trees, r.crop) === t.name; }));
    var bs = null;
    if (base) {
      data.doses.forEach(function (d) { if (d.product === base && d.tree === t.name) bs = d; });
    }
    if (!lab && !bs && !sr) return;
    rows.push({
      tree: t.name,
      onLabel: !!lab,
      target: (lab && lab.target) || (bs && bs.target) || (sr && sr.target) || '',
      doseText: (lab && lab.doseText) || '',
      phiNote: (lab && lab.phiNote) || '',
      dilution: lab ? lab.dilution : null, phi: lab ? lab.phi : null, max: lab ? lab.max : null,
      base: bs ? { dilution: bs.dilution, phi: bs.phi, max: bs.max, src: bs.src } : null,
      search: sr ? { dilution: sr.dilution, phi: sr.phi, max: sr.max, source: sr.source } : null
    });
  });
  var unit = '';
  (label.rows || []).forEach(function (r) {
    var s = trim(r.per20L) + ' ' + trim(r.doseText);
    if (!unit && /\d\s*(ml|㎖|mL)/i.test(s)) unit = 'ml';
    if (!unit && /\d\s*g/i.test(s)) unit = 'g';
  });
  return { ident: ident, matches: matches, base: base, rows: rows, unit: unit };
};

L.fieldVerdicts = function (row) {
  var out = {};
  ['dilution', 'phi', 'max'].forEach(function (f) {
    out[f] = verdict(num(row[f]), row.base ? row.base[f] : null);
  });
  return out;
};

L.confirmOps = function (data, draft, todayIso) {
  var ops = [];
  var existing = data.kit.filter(function (k) { return draft.kitId ? k.id === draft.kitId : L.norm(k.name) === L.norm(draft.name); })[0];
  var kitId = existing ? existing.id : L.uid('k');
  var oldName = existing ? existing.name : '';
  if (existing && oldName !== draft.name) {
    data.doses.forEach(function (d) {
      if (d.product === oldName && d.src === '라벨' && !L.productOf(data, oldName)) ops.push({ table: 'doses', type: 'del', id: d.id });
    });
  }
  ops.push({
    table: 'kit', type: 'put', row: {
      id: kitId, name: draft.name, ingredient: draft.ingredient || '', content: draft.content || '', form: draft.form || '',
      unit: draft.unit || '', covers: draft.covers || '', status: '확인함', checked: todayIso,
      label: JSON.stringify({ cautions: draft.cautions || [], maker: draft.maker || '', group: draft.group || '', model: draft.model || '', sources: (draft.sources || []).slice(0, 6) }),
      added: existing ? existing.added : todayIso

  });
  (draft.rows || []).forEach(function (r) {
    if (!r.use) return;
    var d = num(r.dilution), p = num(r.phi), mx = num(r.max);
    if (d === null && p === null && mx === null && !trim(r.doseText)) return;
    var id = draft.name + '|' + r.tree;
    var prev = data.doses.filter(function (x) { return x.id === id; })[0];
    var was = '';
    if (prev && prev.src !== '라벨') {
      was = '기준값: ' + [prev.dilution ? L.fmtNum(prev.dilution) + '배' : '', prev.phi !== null ? '수확 ' + prev.phi + '일 전' : '', prev.max !== null ? prev.max + '회' : ''].filter(Boolean).join(', ');
    } else if (prev) { was = prev.was; }
    ops.push({
      table: 'doses', type: 'put', row: {
        id: id, product: draft.name, tree: r.tree, target: r.target || (prev ? prev.target : ''),
        dilution: d === null ? (prev && prev.dilution !== null ? prev.dilution : '') : d,
        doseText: trim(r.doseText),
        phi: p === null ? (prev && prev.phi !== null ? prev.phi : '') : p,
        phiNote: trim(r.phiNote) || (prev ? prev.phiNote : ''),
        max: mx === null ? (prev && prev.max !== null ? prev.max : '') : mx,
        src: '라벨', checked: todayIso, was: was
      }
    });
  });
  (draft.photos || []).forEach(function (ph) {
    ops.push({ table: 'photos', type: 'put', row: { id: ph.id || L.uid('p'), kitId: kitId, fileId: ph.fileId || '', thumb: ph.thumb || '', added: todayIso } });
  });
  return { ops: ops, kitId: kitId };
};

L.removeKitOps = function (data, kitId) {
  var k = data.kit.filter(function (x) { return x.id === kitId; })[0];
  var ops = [], fileIds = [];
  if (!k) return { ops: ops, fileIds: fileIds };
  ops.push({ table: 'kit', type: 'del', id: kitId });
  data.photos.forEach(function (p) {
    if (p.kitId === kitId) { ops.push({ table: 'photos', type: 'del', id: p.id }); if (p.fileId) fileIds.push(p.fileId); }
  });
  if (!L.productOf(data, k.name)) {
    data.doses.forEach(function (d) { if (d.product === k.name) ops.push({ table: 'doses', type: 'del', id: d.id }); });
  }
  return { ops: ops, fileIds: fileIds };
};

L.findTaskFor = function (data, tree, base, dn) {
  var o = L.fromDn(dn);
  var checks = {};
  data.checks.forEach(function (c) { checks[c.id] = 1; });
  var best = null;
  [[o.y, o.m], [o.m === 1 ? o.y - 1 : o.y, o.m === 1 ? 12 : o.m - 1], [o.m === 12 ? o.y + 1 : o.y, o.m === 12 ? 1 : o.m + 1]].forEach(function (ym) {
    L.occurrences(data.plan, ym[0], ym[1]).forEach(function (oc) {
      if (oc.task.tree !== tree || oc.task.product !== base || checks[oc.key]) return;
      if (dn < oc.a - 7 || dn > oc.b + 7) return;
      var dist = dn < oc.a ? oc.a - dn : (dn > oc.b ? dn - oc.b : 0);
      if (!best || dist < best.dist || (dist === best.dist && oc.b < best.oc.b)) best = { oc: oc, dist: dist };
    });
  });
  return best ? best.oc : null;
};

L.logOps = function (data, pairs, dateIso, water, memo) {
  var ops = [];
  var dn = L.isoToDn(dateIso);
  var created = new Date().toISOString();
  var used = {};
  pairs.forEach(function (p) {
    var base = p.base || L.canonical(data, p.product);
    var key = p.key || '';
    if (!key) {
      var oc = L.findTaskFor(data, p.tree, base, dn);
      if (oc && !used[oc.key]) key = oc.key;
    }
    if (key) used[key] = 1;
    ops.push({ table: 'logs', type: 'put', row: { id: L.uid('g'), date: dateIso, tree: p.tree, product: p.product, base: base, water: water || '', key: key, memo: memo || '', created: created } });
    if (key) ops.push({ table: 'checks', type: 'put', row: { id: key, date: dateIso } });
  });
  return ops;
};

L.uncheckOps = function (data, key) {
  var ops = [{ table: 'checks', type: 'del', id: key }];
  data.logs.forEach(function (g) { if (g.key === key) ops.push({ table: 'logs', type: 'del', id: g.id }); });
  return ops;
};

L.deleteLogOps = function (data, logId) {
  var g = data.logs.filter(function (x) { return x.id === logId; })[0];
  var ops = [{ table: 'logs', type: 'del', id: logId }];
  if (g && g.key) {
    var others = data.logs.some(function (x) { return x.id !== logId && x.key === g.key; });
    if (!others) ops.push({ table: 'checks', type: 'del', id: g.key });
  }
  return ops;
};

L.josa = function (word, withBatchim, without) {
  var w = String(word || '');
  var c = w.charCodeAt(w.length - 1);
  var has = false;
  if (c >= 0xAC00 && c <= 0xD7A3) has = ((c - 0xAC00) % 28) !== 0;
  else if (/[0136780lmnLMN]$/.test(w)) has = true;
  return w + (has ? withBatchim : without);
};

L.harvestPending = function (data, tree, dn) {
  var o = L.fromDn(dn), hit = false;
  [o.y - 1, o.y, o.y + 1].forEach(function (season) {
    data.plan.forEach(function (t) {
      if (t.tree !== tree || !L.isHarvest(t)) return;
      var w = L.window(t, season);
      if (w && w.b >= dn && w.a - dn <= 150) hit = true;
    });
  });
  return hit;
};

L.logEffects = function (data, ctx, pairs, dateIso, today) {
  var dn = L.isoToDn(dateIso);
  var year = String(dateIso).slice(0, 4);
  var out = [];
  var seen = {};
  pairs.forEach(function (p) {
    var base = p.base || L.canonical(data, p.product);
    var row = L.doseRow(data, p.tree, [p.product, base]);
    var prod = L.productOf(data, base);
    var ptask = p.key ? L.taskOfKey(data, p.key) : null;
    if (row && row.phi !== null && !(ptask && ptask.post) && L.harvestPending(data, p.tree, dn)) {
      out.push({ type: 'harvest', tree: p.tree, product: p.product, date: dn + row.phi, text: L.md(dn + row.phi) + '부터', sub: p.tree + ' 딸 수 있음', note: p.product + ' · 수확 ' + row.phi + '일 전까지' });
    }
    if (row && row.max !== null) {
      var n = L.usage(data, p.tree, base, year);
      out.push({ type: 'count', tree: p.tree, product: p.product, n: n, max: row.max, over: n > row.max, full: n === row.max, text: '올해 ' + n + '회', sub: p.tree + ' ' + p.product, note: '한 해 ' + row.max + '회까지' + (n > row.max ? ' · 횟수를 넘겼습니다' : (n === row.max ? ' · 올해는 더 쓰지 않기' : '')) });
    }
    var gkey = p.tree;
    if (!seen[gkey]) {
      var nexts = [];
      L.upcoming(data, today, 3).forEach(function (oc) {
        if (oc.task.tree !== p.tree || !isSpray(oc.task) || oc.task.product === base) return;
        var gap = Math.max(oc.task.gap || 0, prod ? prod.gap : 0);
        if (!gap || dn + gap < oc.a || dn > oc.b) return;
        nexts.push({ oc: oc, gap: gap });
      });
      if (nexts.length) {
        seen[gkey] = 1;
        var nx = nexts[0];
        var nm = L.resolve(ctx, nx.oc.task.product).name || nx.oc.task.text;
        out.push({ type: 'gap', tree: p.tree, date: dn + nx.gap, text: L.md(dn + nx.gap) + '부터', sub: p.tree + ' ' + nm, note: L.josa(p.product, '과', '와') + ' ' + nx.gap + '일 띄우기' });
      }
    }
  });
  return out;
};

L.harvestDates = function (data, today) {
  var by = {};
  data.logs.forEach(function (g) {
    var dn = L.isoToDn(g.date);
    if (dn === null) return;
    var row = L.doseRow(data, g.tree, [g.product, g.base]);
    var gt = g.key ? L.taskOfKey(data, g.key) : null;
    if (!row || row.phi === null || (gt && gt.post) || !L.harvestPending(data, g.tree, dn)) return;
    var until = dn + row.phi;
    if (until < today) return;
    if (!by[g.tree] || until > by[g.tree].date) by[g.tree] = { tree: g.tree, date: until, product: g.product, phi: row.phi };
  });
  return Object.keys(by).map(function (k) { return by[k]; });
};

L.calcRows = function (data, ctx, water) {
  var out = [];
  data.products.forEach(function (p) {
    if (!SPRAY[p.kind]) return;
    var res = L.resolve(ctx, p.name);
    var names = res.kit && res.kit.name !== p.name ? [res.kit.name, p.name] : [p.name];
    var groups = {}, order = [];
    data.trees.forEach(function (t) {
      var row = L.doseRow(data, t.name, names);
      if (!row) return;
      var k = row.dilution ? String(row.dilution) : (row.doseText ? 't:' + row.doseText : '');
      if (!k) return;
      if (!groups[k]) { groups[k] = { dilution: row.dilution, doseText: row.doseText, trees: [], label: row.src === '라벨' }; order.push(k); }
      groups[k].trees.push(t.name);
    });
    var unit = (res.kit && res.kit.unit) || p.unit || '';
    if (!order.length) { out.push({ name: res.name, plan: p.name, state: res.state, missing: true }); return; }
    order.forEach(function (k) {
      var g = groups[k];
      var amount = '';
      if (g.dilution) {
        var amt = water * 1000 / g.dilution;
        var exact = Math.abs(amt * 10 - Math.round(amt * 10)) < 1e-9;
        amount = (exact ? '' : '약 ') + L.fmtAmount(amt) + unit;
      }
      out.push({
        name: res.name, plan: p.name, state: res.state, missing: false,
        rate: g.dilution ? L.fmtNum(g.dilution) + '배' : g.doseText,
        trees: order.length > 1 || g.trees.length < 3 ? g.trees.join(', ') : '',
        amount: amount, label: g.label
      });
    });
  });
  var seenRow = {};
  out = out.filter(function (r) {
    var k = r.name + '|' + (r.missing ? '-' : r.rate) + '|' + (r.trees || '');
    if (seenRow[k]) return false;
    seenRow[k] = 1;
    return true;
  });
  var rk = { own: 0, alt: 0, buy: 1 };
  out.sort(function (p, q) { return (rk[p.state] - rk[q.state]) || ((p.missing ? 1 : 0) - (q.missing ? 1 : 0)); });
  return out;
};

L.mixTable = function (data, ctx) {
  var rk = { '금지': 0, '확인 안 됨': 1, '가능': 2 };
  var seenMix = {};
  return data.mix.map(function (r) {
    var a = L.resolve(ctx, r.a), b = r.b === '*' ? null : L.resolve(ctx, r.b);
    return {
      id: r.id, a: a.name || r.a, b: b ? (b.name || r.b) : '다른 약', verdict: r.verdict, note: r.note,
      mine: (a.state !== 'buy') && (!b || b.state !== 'buy')
    };
  }).filter(function (r) {
    var k = r.a + '+' + r.b;
    if (seenMix[k]) return false;
    seenMix[k] = 1;
    return true;
  }).sort(function (p, q) { return ((q.mine ? 1 : 0) - (p.mine ? 1 : 0)) || (rk[p.verdict] - rk[q.verdict]); });
};

L.extractJson = function (text) {
  var s = String(text || '');
  var fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) s = fence[1];
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { return null; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;
const L = window.TreeLogic;
const DEMO = !API_URL;

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const clone = (x) => JSON.parse(JSON.stringify(x));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function nowDn() {
  const m = /[?&]today=(\d{4}-\d{2}-\d{2})/.exec(location.search);
  return m ? L.isoToDn(m[1]) : L.todayDn();
}

async function api(action, payload) {
  const body = Object.assign({ action: action, pin: LS.get('tree.pin', '') }, payload || {});
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('서버 응답 ' + res.status);
  const json = await res.json();
  if (!json.ok) {
    const e = new Error(json.error || '알 수 없는 오류');
    e.code = json.code || '';
    e.server = true;
    throw e;
  }
  return json;
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(new Error('사진을 열지 못했습니다.'));
    fr.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('사진을 읽지 못했습니다.'));
    img.src = src;
  });
}
function drawScaled(img, max, q) {
  const w = img.naturalWidth, h = img.naturalHeight;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function fileToPhoto(file) {
  const url = await readAsDataURL(file);
  try {
    const img = await loadImage(url);
    const full = drawScaled(img, 2000, 0.85);
    const thumb = drawScaled(img, 240, 0.6);
    return { id: L.uid('p'), data: full.split(',')[1], mime: 'image/jpeg', thumb: thumb, fileId: '' };
  } catch (e) {
    return { id: L.uid('p'), data: url.split(',')[1], mime: file.type || 'image/jpeg', thumb: '', fileId: '' };
  }
}

function demoLabel(draft, data) {
  const kit = draft.kitId ? data.kit.filter((k) => k.id === draft.kitId)[0] : null;
  if (kit) {
    const rows = data.doses.filter((d) => d.product === kit.name).map((d) => ({
      crop: d.tree === '사과대추' ? '대추' : (d.tree === '백일홍' ? '배롱나무' : d.tree), target: d.target,
      doseText: d.dilution ? L.fmtNum(d.dilution) + '배' : '', dilution: d.dilution, per20L: d.dilution ? L.fmtAmount(20000 / d.dilution) + (kit.name === '라이몬' ? 'ml' : 'g') : '',
      phi: d.phi, phiText: d.phiNote, max: d.max
    }));
    return { name: kit.name, maker: '', ingredient: kit.ingredient, content: kit.content, form: kit.form, kind: '', group: '', rows: rows, cautions: [], unreadable: [] };
  }
  return {
    name: 'IC-66D', maker: '', ingredient: '석회보르도액', content: '', form: '', kind: '살균', group: '',
    rows: [{ crop: '복숭아', target: '세균구멍병', doseText: '50~100배', dilution: null, per20L: '', phi: null, phiText: '싹 트기 전, 수확 뒤 낙엽 직전', max: null }],
    cautions: ['다른 살균제·살충제와 7일 이상 띄우기', '석회유황합제와 섞지 않기'], unreadable: []
  };
}

function Icon({ name, size, bold }) {
  return (
    <svg width={size || 24} height={size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={bold ? 2 : 1.8} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{ICONS[name]}</svg>
  );
}

function StateChips({ res }) {
  if (!res || res.state === 'none') return null;
  if (res.state === 'buy') return <span className="chip buy">구입 필요</span>;
  return (
    <React.Fragment>
      <span className="chip own">보유</span>
      {res.state === 'alt' && <span className="chip alt">대체</span>}
    </React.Fragment>
  );
}

function KindChips({ t }) {
  return (
    <div className="line">
      <span className={'chip kind' + (SPRAY[t.kind] ? ' spray' : '')}>{t.kind}</span>
      {t.seq && <span className="chip kind">{t.seq}</span>}
    </div>
  );
}

function TwoStep({ label, onGo }) {
  const [hot, setHot] = useState(false);
  useEffect(() => {
    if (!hot) return undefined;
    const id = setTimeout(() => setHot(false), 4000);
    return () => clearTimeout(id);
  }, [hot]);
  return (
    <button type="button" className={'btn ghost' + (hot ? ' hot' : '')} onClick={() => { if (hot) { setHot(false); onGo(); } else setHot(true); }}>
      {hot ? '한 번 더' : label}
    </button>
  );
}

function TaskRow({ o, first, data, ctx, today, onToggle, late, skip, extra }) {
  const t = o.task;
  const res = L.resolve(ctx, t.product);
  const done = !!o.doneDate;
  const info = t.product ? L.doseInfo(data, ctx, t.product, t.tree, 20) : null;
  const year = L.fromDn(today).y;
  const row = info && info.row;
  const used = row && row.max !== null ? L.usage(data, t.tree, t.product, year) : 0;
  const limits = [];
  if (row) {
    if (row.phi !== null) limits.push('수확 ' + row.phi + '일 전까지');
    else if (row.phiNote) limits.push(row.phiNote);
    if (row.max !== null) limits.push('한 해 ' + row.max + '회까지' + (used ? ' (올해 ' + used + '회 씀)' : ''));
  }
  const full = row && row.max !== null && used >= row.max && !done;
  const title = t.product ? res.name : t.text;
  return (
    <div className={'task' + (first ? ' first' : '') + (done ? ' done' : '')}>
      <button type="button" className={'check' + (done ? ' on' : '')} aria-pressed={done} aria-label={t.tree + ' ' + title + (done ? ' 완료 취소' : ' 완료 표시')} onClick={() => onToggle(o)}>
        <span>{done && <Icon name="tick" size={22} bold />}</span>
      </button>
      <div className="task-body">
        <KindChips t={t} />
        {t.product ? (
          <React.Fragment>
            <div className="line"><span className="pname">{res.name}</span><StateChips res={res} /></div>
            {res.state === 'alt' && <div className="green-note">계획의 {L.josa(t.product, '과', '와')} 같은 약입니다.</div>}
            {t.text && <div className="note">{t.text}</div>}
            {info.line && <div className="dose">{info.line}{row && (row.dilution || row.doseText) ? <span className="src">{info.fromLabel ? '라벨 확인함' : '기준값 · 라벨 확인 전'}</span> : null}</div>}
          </React.Fragment>
        ) : (
          <div className="pname">{t.text}</div>
        )}
        {t.note && <div className="note">{t.note}</div>}
        {extra && <div className="green-note">{extra}</div>}
        {limits.length > 0 && <div className="small">{limits.join(' · ')}</div>}
        {full && <div className="warn-note">올해 횟수를 다 썼습니다. 다른 계통의 약으로 바꾸세요.</div>}
        {skip && o.phiPast && <div className="warn-note">수확 {o.phiDays}일 전이 지났습니다 (수확 시작을 {L.md(o.harvestAt)}로 볼 때). 이번에는 쓰지 않습니다.</div>}
        {skip && !o.phiPast && <div className="warn-note">수확 {o.phiDays}일 전인 {L.md(o.phiCap)}까지만 쓸 수 있습니다 (수확 시작을 {L.md(o.harvestAt)}로 볼 때). 넘기면 건너뛰세요.</div>}
        {!skip && !done && o.inHarvest && <div className="warn-note">지금은 수확하는 때입니다. 수확 {o.phiDays}일 전까지만 쓸 수 있으니 열매를 다 딴 뒤에 뿌리세요.</div>}
        {!skip && !done && o.phiCap !== undefined && <div className="warn-note">수확을 {L.md(o.harvestAt)}에 시작한다면 {L.md(o.phiCap)}까지만</div>}
        {o.wait && !done && <div className="green-note">{L.josa(o.wait.product, '을', '를')} 뿌린 {L.md(o.wait.date)}에서 {o.wait.gap}일 뒤인 {L.md(o.wait.until)}부터</div>}
        {done ? (
          <div className="small">{o.doneDate && o.doneDate !== 'done' ? L.md(L.isoToDn(o.doneDate)) + '에 함' : '끝냄'}</div>
        ) : (
          <div className={'period' + (late || skip ? ' late' : '')}><span className="k">{skip ? (o.phiPast ? '건너뛰기' : '빠듯함') : late ? '지남' : '기간'}</span><span className="v">{t.label}</span></div>
        )}
      </div>
    </div>
  );
}

function TreeCards({ items, data, ctx, today, onToggle, late, skip }) {
  return L.groupByTree(items).map((g) => {
    const mix = L.mixLines(data, ctx, g.items);
    return (
      <div className="tree-card" key={g.tree}>
        <div className="tree-name">{g.tree}</div>
        {g.items.map((o, i) => <TaskRow key={o.key} o={o} first={i === 0} data={data} ctx={ctx} today={today} onToggle={onToggle} late={late} skip={skip} />)}
        {mix.length > 0 && !skip && (
          <div className="mixbox">
            <div className="cap">한 통에 섞어도 되나</div>
            {mix.map((m, i) => (
              <div className="between" key={i}>
                <span className="small" style={{ fontWeight: 700, color: 'var(--text)' }}>{m.a} + {m.b}</span>
                <MixChip verdict={m.verdict} />
              </div>
            ))}
          </div>
        )}
      </div>
    );
  });
}

function MixChip({ verdict }) {
  if (verdict === '가능') return <span className="chip own">섞어도 됨</span>;
  if (verdict === '금지') return <span className="chip bad">섞지 않기</span>;
  return <span className="chip tagc">확인 안 됨, 따로</span>;
}

function NetBanner({ store }) {
  if (store.net === 'demo') return <div className="banner">예시 데이터로 보는 중입니다. 이 휴대폰에만 저장됩니다. index.html의 API_URL에 웹 앱 주소를 넣으면 시트와 연결됩니다.</div>;
  if (store.net === 'offline') return <div className="banner">연결이 안 됩니다. 저장해 둔 내용으로 보여 줍니다.{store.pending > 0 ? ' 보내지 못한 변경 ' + store.pending + '건은 연결되면 저장합니다.' : ''}<button type="button" className="linkbtn" onClick={() => store.sync(true)}>다시 연결</button></div>;
  if (store.net === 'error') return <div className="banner bad">저장하지 못한 변경이 있습니다. {store.netMsg}<button type="button" className="linkbtn" onClick={() => store.sync(true)}>새로 고침</button></div>;
  if (store.net === 'setup') return <div className="banner bad">시트가 준비되지 않았습니다. Apps Script에서 setup을 실행해 주세요. {store.netMsg}</div>;
  return null;
}

function TreeFold({ f, open, onFlip, data, ctx, today, visits, tap }) {
  const can = f.status !== 'none' || f.parts.length > 0;
  const visitText = (n) => {
    const v = visits.filter((x) => x.n === n)[0];
    if (!v || visits.length < 2) return '';
    const lo = L.fromDn(v.lo), hi = L.fromDn(v.hi);
    return (ORD[n - 1] || n) + ' 번째 가는 날 (' + (v.lo === v.hi ? lo.d : lo.d + '–' + hi.d) + '일)에 할 일';
  };
  const mixes = [];
  visits.forEach((v) => {
    const mine = f.items.filter((x) => x.cat === 'visit' && x.visit === v.n).map((x) => x.o);
    L.mixLines(data, ctx, mine).forEach((m) => mixes.push(m));
  });
  return (
    <div className="fold">
      <button type="button" className={'fold-head' + (open ? ' open' : '')} aria-expanded={can ? open : undefined} disabled={!can} onClick={onFlip}>
        <span className="fold-main">
          <span className="line">
            <span className="tree-name mid">{f.tree}</span>
            {f.status === 'plan' && <span className="chip alt">방제 계획 있음</span>}
            {f.status === 'done' && <span className="chip own">방제 완료</span>}
            {f.status === 'care' && <span className="chip buy">관리만 있음</span>}
            {f.late && <span className="chip bad">기간 지남</span>}
            {f.parts.length > 0 && <span className="chip part"><Icon name="tick" size={13} bold />부분방제 {f.partText}</span>}
          </span>
          <span className="fold-sub">{f.sub}{f.buy ? ' · 구입 필요' : ''}</span>
        </span>
        {can && <span className={'chev' + (open ? ' up' : '')}><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>}
      </button>
      {open && can && (
        <div className="fold-body">
          {f.parts.map((g) => (
            <div className="fold-part" key={g.id}>
              <span>부분방제 · {g.product}</span>
              <span className="small">{f.month}월 {g.day}일에 뿌림{g.water ? ' · 물 ' + g.water + 'L' : ''}</span>
            </div>
          ))}
          {f.notices.map((n, i) => <div className="fold-note" key={i}><strong>지킬 것</strong> · {n}</div>)}
          {f.items.map((x) => (
            <TaskRow key={x.o.key} o={x.o} data={data} ctx={ctx} today={today} onToggle={tap} late={x.cat === 'late'} skip={x.cat === 'skip'} extra={x.o.doneDate ? '' : x.cat === 'visit' ? visitText(x.visit) : x.cat === 'later' ? '다음 달로 넘겨도 되는 일입니다' : ''} />
          ))}
          {mixes.length > 0 && (
            <div className="mixbox">
              <div className="cap">한 통에 섞어도 되나</div>
              {mixes.map((m, i) => (
                <div className="between" key={i}>
                  <span className="small" style={{ fontWeight: 700, color: 'var(--text)' }}>{m.a} + {m.b}</span>
                  <MixChip verdict={m.verdict} />
                </div>
              ))}
            </div>
          )}
          {f.routine.map((r, i) => (
            <div className="fold-plain" key={i}><span className="cap">갈 때마다</span><span>{r}</span></div>
          ))}
        </div>
      )}
    </div>
  );
}

function MainScreen({ store, data, ctx, today, go, onToggle, onVisitRecord, openSettings, openTrees, setOpenTrees }) {
  const o = L.fromDn(today);
  const mp = useMemo(() => L.monthPlan(data, ctx, today, o.y, o.m), [data, ctx, today]);
  const folds = useMemo(() => L.treeFolds(data, ctx, mp, today), [data, ctx, mp, today]);
  const lastTap = useRef({});
  const tap = (x) => {
    const now = Date.now();
    if (lastTap.current[x.key] && now - lastTap.current[x.key] < 800) return;
    lastTap.current[x.key] = now;
    try { if (navigator.vibrate) navigator.vibrate(15); } catch (e) {}
    onToggle(x);
  };
  const flip = (name) => setOpenTrees(Object.assign({}, openTrees, { [name]: !openTrees[name] }));
  const dtext = (v) => { const lo = L.fromDn(v.lo), hi = L.fromDn(v.hi); return (v.lo === v.hi ? String(lo.d) : lo.d + '–' + hi.d) + '일'; };
  const visitNotes = [];
  mp.visits.forEach((v) => {
    const waiter = v.items.filter((x) => x.wait && x.wait.until === v.lo)[0];
    const head = mp.visits.length > 1 ? (ORD[v.n - 1] || v.n) + ' 번째는 ' : '';
    if (waiter) visitNotes.push(head + L.josa(waiter.wait.product, '을', '를') + ' 뿌린 날에서 ' + waiter.wait.gap + '일이 지난 뒤부터입니다.');
    else if (v.after) visitNotes.push(head + (ORD[v.after.n - 1] || v.after.n) + ' 번째에서 ' + v.gapDays + '일이 지난 뒤부터입니다.');
  });
  return (
    <React.Fragment>
      <div className="hero">
        <div className="hero-top">
          <div className="hero-col">
            <div className="eyebrow">우리 집 과수 방제력</div>
            <h1 className="month">{o.m}월</h1>
          </div>
          <div className="hero-side">
            <button type="button" className="gear" aria-label="설정" onClick={openSettings}><Icon name="gear" /></button>
            <div>오늘<strong>{L.md(today)}</strong></div>
          </div>
        </div>
        <div className="tiles">
          <div className="tile"><b>{mp.visits.length}</b><span>번 방문</span></div>
          <div className="tile"><b>{mp.taskCount}</b><span>가지 할 일</span></div>
          <div className="tile"><b>{mp.buyCount}</b><span>가지 살 약</span></div>
        </div>
      </div>
      <div className="body" style={{ gap: 20 }}>
        <NetBanner store={store} />

        <div className="card" style={{ padding: '14px 16px', gap: 6 }}>
          <div className="cap">이달에 가는 날</div>
          {mp.visits.length > 0 ? (
            <div className="line">{mp.visits.map((v) => <span className="daypill" key={v.n}>{dtext(v)}</span>)}</div>
          ) : (
            <div style={{ fontSize: 17, fontWeight: 700 }}>{mp.later.length > 0 ? '꼭 가야 하는 날은 없습니다. 다음 달로 넘겨도 되는 일만 있습니다.' : '이달에 날짜가 정해진 일은 없습니다.'}</div>
          )}
          {mp.visits.length > 0 && <div className="small">{visitNotes.length ? visitNotes.join(' ') : '이 기간 중 하루에 가면 됩니다.'}</div>}
        </div>

        <div className="stack">
          {folds.map((f) => <TreeFold key={f.tree} f={f} open={!!openTrees[f.tree]} onFlip={() => flip(f.tree)} data={data} ctx={ctx} today={today} visits={mp.visits} tap={tap} />)}
        </div>

      </div>
    </React.Fragment>
  );
}

function ARow({ o, ctx }) {
  const t = o.task;
  const res = L.resolve(ctx, t.product);
  const done = !!o.doneDate;
  return (
    <div className={'arow' + (done ? ' done' : '')}>
      <div className="line">
        <span className={'chip ' + (t.kind === '주의' ? 'tagc' : 'kind' + (SPRAY[t.kind] ? ' spray' : ''))}>{t.kind}</span>
        {t.seq && <span className="chip kind">{t.seq}</span>}
        {done && <span className="chip own">끝냄</span>}
      </div>
      {t.product ? (
        <React.Fragment>
          <div className="line"><span className={res.state === 'buy' ? 'pname soft' : 'pname'}>{res.name}</span><StateChips res={res} /></div>
          {res.state === 'alt' && <div className="green-note">계획의 {t.product} 대신</div>}
          <div className="note">{t.text}</div>

function YearView({ data, ctx, today }) {
  const rows = useMemo(() => L.yearGrid(data, today), [data, today]);
  const cur = L.fromDn(today);
  const [sel, setSel] = useState(null);
  const [table, setTable] = useState(false);
  const short = (name) => (name.length > 3 ? name.slice(-2) : name);
  const legend = (
    <div className="ylegend">
      <span><span className="ym f"></span>살균</span>
      <span><span className="ym b"></span>살충</span>
      <span><span className="ym o"></span>동계</span>
      <span><span className="ym c"></span>관리</span>
      <span><span className="ydone still"><Icon name="tick" size={11} bold /></span>뿌림</span>
    </div>
  );
  if (table) {
    const markOf = { '동계': 'o', '살균': 'f', '살충': 'b', '관리': 'c', '주의': 'n' };
    return (
      <React.Fragment>
        <button type="button" className="btn line2" onClick={() => setTable(false)}>요약으로 보기</button>
        <div className="ytable-box">
          <div className="ytable" style={{ gridTemplateColumns: '52px repeat(' + data.trees.length + ', 148px)', width: 52 + data.trees.length * 148 }}>
            <div className="yt-corner"></div>
            {data.trees.map((t) => <div className="yt-head" key={t.name}>{t.name}</div>)}
            {rows.map((r) => (
              <React.Fragment key={r.m}>
                <div className={'yt-month' + (r.now ? ' now' : '')}>{r.m}월</div>
                {r.cells.map((c) => (
                  <div className={'yt-cell' + (r.now ? ' now' : '') + (r.past ? ' past' : '')} key={c.tree}>
                    {c.sprays.length > 0 && (
                      <div className="yt-group done">
                        <span className="yt-kind"><span className="ydone still"><Icon name="tick" size={11} bold /></span>뿌림</span>
                        {c.sprays.map((g) => <span className="yt-line" key={g.id}>{r.m}/{g.day} {g.product}</span>)}
                      </div>
                    )}
                    {L.yearText(ctx, c.items).map((g) => (
                      <div className="yt-group" key={g.kind}>
                        <span className="yt-kind"><span className={'ym ' + markOf[g.kind]}></span>{g.kind}</span>
                        {g.lines.map((line, i) => <span className="yt-line" key={i}>{line}</span>)}
                      </div>
                    ))}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        </div>
        <div className="hint">올해 1월부터 12월까지입니다. 약 이름과 할 일만 짧게 적었고, 뿌린 기록은 칸 맨 위에 날짜와 함께 나옵니다. 지난 달의 계획은 흐리게 보입니다.</div>
      </React.Fragment>
    );
  }
  let pick = sel;
  if (!pick) {
    const nowRow = rows.filter((r) => r.now)[0] || rows[0];
    const first = nowRow.cells.filter((c) => c.items.length > 0 || c.sprays.length > 0)[0] || nowRow.cells[0];
    pick = { m: nowRow.m, tree: first ? first.tree : '' };
  }
  const pickRow = rows.filter((r) => r.m === pick.m)[0];
  const pickCell = pickRow ? pickRow.cells.filter((c) => c.tree === pick.tree)[0] : null;
  const items = pickCell ? pickCell.items : [];
  const sprays = pickCell ? pickCell.sprays : [];
  return (
    <React.Fragment>
      {legend}
      <div className="ygrid" style={{ gridTemplateColumns: '40px repeat(' + data.trees.length + ', minmax(0, 1fr))' }}>
        <div></div>
        {data.trees.map((t) => <div className="yg-head" key={t.name}>{short(t.name)}</div>)}
        {rows.map((r) => (
          <React.Fragment key={r.m}>
            <div className={'yg-month' + (r.now ? ' now' : '') + (r.past ? ' past' : '')}>{r.m}월</div>
            {r.cells.map((c) => {
              const on = pick.m === r.m && pick.tree === c.tree;
              if (!c.items.length && !c.sprays.length) return <div className={'yg-cell empty' + (r.now ? ' now' : '')} key={c.tree}></div>;
              return (
                <button type="button" key={c.tree} className={'yg-cell' + (r.now ? ' now' : '') + (r.past ? ' past' : '') + (on ? ' on' : '')} aria-pressed={on} aria-label={r.m + '월 ' + c.tree + ' 할 일 ' + c.items.length + '가지' + (c.sprays.length ? ', 뿌린 기록 ' + c.sprays.length + '건' : '')} onClick={() => setSel({ m: r.m, tree: c.tree })}>
                  <YMarks c={c} />
                </button>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      <div className="hint">올해 1월부터 12월까지입니다. 칸을 누르면 그 달 그 나무의 할 일과 뿌린 기록이 아래에 나옵니다. 진한 줄이 이번 달이고, 지난 달은 흐리게 보입니다.</div>
      <div className="stack">
        <h2 className="h2" style={{ fontSize: 30 }}>{pick.m}월 · {pick.tree}</h2>
        {sprays.length > 0 && (
          <div className="card dark" style={{ gap: 6 }}>
            <div className="cap">뿌린 기록</div>
            {sprays.map((g) => (
              <div className="between" key={g.id}>
                <span style={{ fontSize: 19, fontWeight: 700 }}>{g.product}</span>
                <span style={{ fontSize: 15, color: 'var(--mist)' }}>{pick.m}월 {g.day}일{g.water ? ' · 물 ' + g.water + 'L' : ''}</span>
              </div>
            ))}
          </div>
        )}
        {items.length === 0 ? (sprays.length > 0 ? null : <div className="card"><div className="note">이 달에는 할 일이 없습니다.</div></div>) : (
          <div className="card tight" style={{ padding: '2px 16px' }}>
            {items.map((o) => {
              const t = o.task;
              const res = L.resolve(ctx, t.product);
              return (
                <div className="row" key={o.key} style={{ padding: '12px 0', opacity: o.doneDate ? 0.55 : 1 }}>
                  <div className="line" style={{ gap: 8 }}>
                    <span className={'chip ' + (t.kind === '주의' ? 'tagc' : 'kind')}>{t.seq ? t.kind + ' ' + t.seq : t.kind}</span>
                    {t.product ? <React.Fragment><span className={res.state === 'buy' ? 'pname soft' : 'pname'} style={{ fontSize: res.state === 'buy' ? 18 : 19 }}>{res.name}</span><StateChips res={res} /></React.Fragment> : <span style={{ fontSize: 17, fontWeight: 700, lineHeight: 1.4 }}>{t.text}</span>}
                    {o.doneDate && <span className="chip own">끝냄</span>}
                  </div>
                  <div className="small">{t.product && t.text ? t.text + ' · ' + t.label : t.label}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <button type="button" className="btn line2" onClick={() => { setTable(true); }}>전체 표로 보기</button>
    </React.Fragment>
  );
}

function AheadScreen({ data, ctx, today }) {
  const [mode, setMode] = useState('month');
  const months = useMemo(() => L.monthList(today, 12), [today]);
  const [mi, setMi] = useState(0);
  const [tree, setTree] = useState(data.trees.length ? data.trees[0].name : '');
  const checks = useMemo(() => { const c = {}; data.checks.forEach((x) => { c[x.id] = x.date || 'done'; }); return c; }, [data]);
  const order = useMemo(() => L.treeOrder(data), [data]);
  const cur = L.fromDn(today);
  let groups = [];
  if (mode === 'month') {
    const ym = months[mi] || months[0];
    const occ = L.occurrences(data.plan, ym.y, ym.m).filter((x) => x.b >= today || checks[x.key]);
    occ.forEach((x) => { x.doneDate = checks[x.key] || ''; });
    occ.sort((p, q) => ((order[p.task.tree] || 0) - (order[q.task.tree] || 0)) || (p.a - q.a));
    groups = L.groupByTree(occ).map((g) => ({ key: g.tree, title: g.tree, items: g.items }));
  } else if (mode === 'tree') {
    const idx = {};
    L.upcoming(data, today, 12).filter((x) => x.task.tree === tree).forEach((x) => {
      x.doneDate = checks[x.key] || '';
      const s = L.fromDn(Math.max(x.a, today));
      const k = s.y + '-' + s.m;
      if (idx[k] === undefined) { idx[k] = groups.length; groups.push({ key: k, title: s.m + '월', year: s.y !== cur.y ? s.y + '년' : '', items: [] }); }
      groups[idx[k]].items.push(x);
    });
  }
  return (
    <React.Fragment>
      <div className="hero">
        <div className="hero-col">
          <div className="eyebrow">할 일 미리 보기</div>
          <h1>앞으로</h1>
          <div className="hero-sub">{mode === 'year' ? '일 년 치를 한 화면에서 봅니다.' : '달마다, 나무마다 무엇을 언제까지 하는지 봅니다.'}</div>
        </div>
        <div className="seg" role="tablist">
          <button type="button" role="tab" aria-selected={mode === 'month'} className={mode === 'month' ? 'on' : ''} onClick={() => setMode('month')}>달별</button>
          <button type="button" role="tab" aria-selected={mode === 'tree'} className={mode === 'tree' ? 'on' : ''} onClick={() => setMode('tree')}>나무별</button>
          <button type="button" role="tab" aria-selected={mode === 'year'} className={mode === 'year' ? 'on' : ''} onClick={() => setMode('year')}>한눈에</button>
        </div>
      </div>
      <div className="body">
        {mode === 'year' && <YearView data={data} ctx={ctx} today={today} />}
        {mode === 'year' ? null : mode === 'month' ? (
          <div className="chips">
            {months.map((ym, i) => (
              <button type="button" key={ym.y + '-' + ym.m} className={'pick' + (i === mi ? ' on' : '')} aria-pressed={i === mi} onClick={() => setMi(i)}>
                {(i === 0 || ym.m === 1) && ym.y !== cur.y ? <small>{ym.y}</small> : null}{ym.m}월
              </button>
            ))}
          </div>
        ) : (
          <div className="chips">
            {data.trees.map((t) => (
              <button type="button" key={t.name} className={'pick' + (t.name === tree ? ' on' : '')} aria-pressed={t.name === tree} onClick={() => setTree(t.name)}>{t.name}</button>
            ))}
          </div>
        )}
        {mode !== 'year' && groups.length === 0 && <div className="card"><div className="note">이 기간에는 할 일이 없습니다.</div></div>}
        {groups.map((g) => (
          <div className="stack" key={g.key}>
            {mode === 'month' ? (
              <div className="tree-card">
                <div className="tree-name mid">{g.title}</div>
                {g.items.map((x) => <ARow key={x.key} o={x} ctx={ctx} />)}
              </div>
            ) : (
              <React.Fragment>
                <div className="month-head"><b>{g.title}</b>{g.year && <span className="small">{g.year}</span>}</div>
                <div className="tree-card">{g.items.map((x) => <ARow key={x.key} o={x} ctx={ctx} />)}</div>
              </React.Fragment>
            )}
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}
