              {reading ? <React.Fragment><span className="spin"></span>라벨을 읽는 중입니다</React.Fragment> : '라벨 읽기'}
            </button>
            {reading && <div className="hint">사진을 올리고 글자를 읽습니다. 30초에서 1분쯤 걸립니다. 화면을 닫지 마세요.</div>}
            {!reading && status && !status.hasKey && !DEMO && <div className="banner">Gemini 키가 아직 없습니다. 사진은 드라이브에 저장되고, 값은 직접 적어 넣을 수 있습니다.</div>}
            <button type="button" className="btn line2" disabled={reading} onClick={onCancel}>그만두기</button>
          </div>
        )}

        {res && (
          <React.Fragment>
            {res.demo && <div className="banner">예시 결과입니다. 실제 사진은 읽지 않았습니다. 시트와 Gemini를 연결하면 사진에서 읽은 값이 나옵니다.</div>}
            {res.readError && <div className="banner bad">{res.readError}</div>}
            {(res.unreadable || []).length > 0 && <div className="banner">읽지 못한 부분: {res.unreadable.join(' / ')}</div>}

            <div className="card">
              <div className="cap">사진에서 읽은 약</div>
              <input className="input name" aria-label="약 이름" value={res.ident.name} onChange={(e) => setIdent('name', e.target.value)} placeholder="약 이름" />
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div className="field" style={{ gridColumn: '1 / 3' }}><label htmlFor="c-ing">성분</label><input id="c-ing" className="input" value={res.ident.ingredient} onChange={(e) => setIdent('ingredient', e.target.value)} /></div>
                <div className="field"><label htmlFor="c-con">함량</label><input id="c-con" className="input" value={res.ident.content} onChange={(e) => setIdent('content', e.target.value)} /></div>
                <div className="field"><label htmlFor="c-form">제형</label><input id="c-form" className="input" value={res.ident.form} onChange={(e) => setIdent('form', e.target.value)} /></div>
              </div>
              <div className="field">
                <span className="flabel">재는 단위</span>
                <div className="chips wrap">
                  {['g', 'ml'].map((u) => <button type="button" key={u} className={'pick' + (unitOf === u ? ' on' : '')} aria-pressed={unitOf === u} onClick={() => setRes({ unit: u })}>{u}</button>)}
                </div>
              </div>
              <div className="small">잘못 읽은 칸은 눌러서 고칠 수 있습니다.</div>
            </div>

            <div className="stack">
              <h2 className="h2">읽은 용량과 용법</h2>
              {shown.length === 0 && <div className="card"><div className="note">라벨에서 우리 나무의 줄을 찾지 못했습니다. 이 약은 우리 나무에 등록되지 않았을 수 있습니다. 표가 나온 사진을 더 올리거나, 아래에서 나무를 골라 직접 적어 주세요.</div></div>}
              {shown.map((r) => {
                const b = baseOf(r.tree);
                const fv = L.fieldVerdicts(Object.assign({}, r, { base: b }));
                const d = L.num(r.dilution);
                const s = r.search || {};
                const sdiff = (f) => s[f] !== null && s[f] !== undefined && L.num(r[f]) !== null && L.num(r[f]) !== s[f];
                return (
                  <div className="card" key={r.tree} style={{ gap: 4 }}>
                    <div className="between">
                      <div className="tree-name mid">{r.tree}</div>
                      <button type="button" className={'toggle' + (r.use ? ' on' : '')} role="switch" aria-checked={!!r.use} aria-label={r.tree + ' 값을 계획에 넣기'} onClick={() => setRow(r.tree, { use: !r.use })}></button>
                    </div>
                    {r.target && <div className="small">{r.target}</div>}
                    {r.doseText && <div className="small">라벨 표기: {r.doseText}</div>}
                    {r.phiNote && <div className="small">사용 시기: {r.phiNote}</div>}
                    {r.use && (
                      <div>
                        <NumField id={'d-' + r.tree} label="희석배수" value={r.dilution} unit="배" onChange={(v) => setRow(r.tree, { dilution: v })} verdict={fv.dilution} baseText={b && b.dilution ? L.fmtNum(b.dilution) + '배' : ''} extra={d ? '물 20L에 ' + L.fmtAmount(20000 / d) + unitOf : ''} searchText={s.dilution ? L.fmtNum(s.dilution) + '배' : ''} searchDiff={sdiff('dilution')} />
                        <NumField id={'p-' + r.tree} label="수확 전" value={r.phi} unit="일 전까지" onChange={(v) => setRow(r.tree, { phi: v })} verdict={fv.phi} baseText={b && b.phi !== null ? b.phi + '일' : ''} searchText={s.phi !== null && s.phi !== undefined ? s.phi + '일' : ''} searchDiff={sdiff('phi')} />
                        <NumField id={'m-' + r.tree} label="한 해" value={r.max} unit="회까지" onChange={(v) => setRow(r.tree, { max: v })} verdict={fv.max} baseText={b && b.max !== null ? b.max + '회' : ''} searchText={s.max !== null && s.max !== undefined ? s.max + '회' : ''} searchDiff={sdiff('max')} />
                      </div>
                    )}
                    {!r.use && <div className="small">이 나무의 값은 넣지 않습니다.</div>}
                  </div>
                );
              })}
              {skipped.length > 0 && (
                <div className="card">
                  <div className="cap">라벨에서 찾지 못한 나무</div>
                  <div className="note">기준값을 그대로 둡니다. 직접 적으려면 나무를 누르세요.</div>
                  <div className="chips wrap">
                    {skipped.map((r) => <button type="button" key={r.tree} className="pick" onClick={() => setRow(r.tree, { use: true })}>{r.tree}</button>)}
                  </div>
                </div>
              )}
            </div>

            <div className="stack">
              <h2 className="h2">방제 계획에 넣는 방법</h2>
              <div className="card dark" style={{ gap: 6 }}>
                {!main && <React.Fragment><span className="chip buy" style={{ alignSelf: 'flex-start', color: 'var(--ivory)', borderColor: 'var(--ivory)' }}>계획에 없는 약</span><div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>계획에 있는 약과 이름도 성분도 다릅니다.</div><div className="small" style={{ color: 'var(--mist)' }}>내 약에는 넣지만 계획에는 표시하지 않습니다. 같은 일을 하는 약이면 아래에서 골라 주세요.</div></React.Fragment>}
                {main && main.type === 'same' && <React.Fragment><span className="chip own" style={{ alignSelf: 'flex-start' }}>계획의 약</span><div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>계획에 있는 {main.product}입니다.</div><div className="small" style={{ color: 'var(--mist)' }}>계획에 보유로 표시하고, 라벨 값으로 용량과 용법을 맞춥니다.</div></React.Fragment>}
                {main && main.type === 'alt' && <React.Fragment><span className="chip alt" style={{ alignSelf: 'flex-start' }}>대체제로 넣음</span><div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>계획의 {L.josa(matches.filter((m) => m.type === 'alt').map((m) => m.product).join(', '), '과', '와')} 같은 약입니다.</div><div className="small" style={{ color: 'var(--mist)' }}>계획에서 {matches.filter((m) => m.type === 'alt').map((m) => m.product).join(', ')} 대신 {L.josa(res.ident.name || '이 약', '으로', '로')} 표시합니다.</div></React.Fragment>}
                {main && main.type === 'similar' && <React.Fragment><span className="chip alt" style={{ alignSelf: 'flex-start' }}>비슷한 약</span><div style={{ fontSize: 19, fontWeight: 700, lineHeight: 1.4 }}>{L.josa(main.product, '과', '와')} 성분은 같지만 함량이나 제형이 다릅니다.</div><div className="small" style={{ color: 'var(--mist)' }}>용량이 다를 수 있어 자동으로는 바꿔 넣지 않습니다. 라벨 값을 확인했으면 아래에서 {main.product} 대신 쓰기를 고르세요.</div></React.Fragment>}
              </div>
              <CoverSelect value={res.covers} onChange={(v) => setRes({ covers: v })} products={data.products} />
            </div>

            {(res.cautions || []).length > 0 && (
              <div className="stack">
                <h2 className="h2">라벨의 주의</h2>
                <div className="card tight">{res.cautions.map((c, i) => <div className="row" key={i}><div style={{ fontSize: 17, fontWeight: 500 }}>{c}</div></div>)}</div>
              </div>
            )}

            <div className="stack">
              <h2 className="h2">검색으로 맞춰 본 결과</h2>
              {(res.sources || []).length > 0 ? (
                <div className="card tight">
                  {res.searchNotes && <div className="row"><div className="note">{res.searchNotes}</div></div>}
                  {res.sources.map((s, i) => <div className="row" key={i}><a href={s.uri} target="_blank" rel="noopener" style={{ fontSize: 16, fontWeight: 700, minHeight: 30, display: 'inline-flex', alignItems: 'center' }}>{s.title || '출처 ' + (i + 1)}</a></div>)}
                  <div className="row"><div className="small">검색 값은 참고용입니다. 계획에는 라벨에서 읽은 값만 넣습니다.</div></div>
                </div>
              ) : (
                <div className="card"><div className="note">{res.demo ? '예시에서는 검색하지 않습니다.' : (res.warnings || []).indexOf('SEARCH_OFF') >= 0 ? '검색이 꺼져 있습니다. 설정에서 켤 수 있습니다.' : (res.warnings || []).indexOf('NO_KEY') >= 0 ? 'Gemini 키가 없어 검색하지 않았습니다.' : '믿을 만한 근거 페이지를 찾지 못해 검색 값은 쓰지 않았습니다. 라벨 값과 기준값만 맞춰 봤습니다.'}</div></div>
              )}
            </div>

            <div className="stack">
              <button type="button" className="btn" onClick={onConfirm}>확인했어요, 계획에 넣기</button>
              <button type="button" className="btn line2" disabled={reading} onClick={() => setDraft(Object.assign({}, draft, { result: null }))}>사진 다시 올리기</button>
              <button type="button" className="btn line2" onClick={onCancel}>그만두기</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </React.Fragment>
  );
}

function RecordScreen({ data, ctx, today, prefill, clearPrefill, onSave, onDeleteLog }) {
  const [date, setDate] = useState(L.dnToIso(today));
  const [off, setOff] = useState({});
  const [trees, setTrees] = useState([]);
  const [prods, setProds] = useState([]);
  const [water, setWater] = useState('');
  const [result, setResult] = useState(null);
  useEffect(() => {
    const init = {};
    if (prefill) { prefill.items.forEach((it) => { if (it.buy) init[it.key] = true; }); setResult(null); }
    setOff(init);
  }, [prefill]);
  const year = String(date).slice(0, 4);
  const flip = (list, set, v) => set(list.indexOf(v) >= 0 ? list.filter((x) => x !== v) : list.concat([v]));
  const options = useMemo(() => {
    const out = [], seen = {};
    data.kit.forEach((k) => { if (!seen[k.name]) { seen[k.name] = 1; out.push({ name: k.name, own: true }); } });
    data.products.forEach((p) => { if (SPRAY[p.kind] && !ctx.own[p.name] && !seen[p.name]) { seen[p.name] = 1; out.push({ name: p.name, own: false }); } });
    return out;
  }, [data, ctx]);
  const pairs = [];
  const seenPair = {};
  const extra = [];
  if (prefill) {
    prefill.items.forEach((it) => {
      if (off[it.key]) return;
      if (it.product) { seenPair[it.tree + '|' + it.product] = 1; pairs.push(it); } else extra.push(it);
    });
  }
  trees.forEach((t) => prods.forEach((p) => { if (!seenPair[t + '|' + p]) { seenPair[t + '|' + p] = 1; pairs.push({ tree: t, product: p }); } }));
  const canSave = !!date && (pairs.length > 0 || extra.length > 0);
  const save = () => {
    const fx = onSave(pairs, extra, date, water);
    setResult({ fx: fx, date: date, count: pairs.length + extra.length });
    setTrees([]); setProds([]); setWater(''); clearPrefill();
    window.scrollTo(0, 0);
  };
  const logs = data.logs.filter((g) => String(g.date).slice(0, 4) === String(L.fromDn(today).y)).slice().sort((p, q) => (p.date < q.date ? 1 : p.date > q.date ? -1 : 0));
  const counts = useMemo(() => {
    const m = {}, out = [];
    data.logs.forEach((g) => {
      if (String(g.date).slice(0, 4) !== String(L.fromDn(today).y)) return;
      const base = g.base || L.canonical(data, g.product);
      const k = g.tree + '|' + base;
      if (!m[k]) { const row = L.doseRow(data, g.tree, [g.product, base]); m[k] = { tree: g.tree, product: g.product, n: 0, max: row ? row.max : null }; out.push(m[k]); }
      m[k].n++;
    });
    return out;
  }, [data, today]);
  const harvest = useMemo(() => L.harvestDates(data, today), [data, today]);
  return (
    <React.Fragment>
      <div className="hero"><div className="hero-col"><div className="eyebrow">뿌린 날 적기</div><h1>기록</h1><div className="hero-sub">적어 두면 수확할 수 있는 날과 다음 약 날짜를 알려 줍니다.</div></div></div>
      <div className="body">
        {result && (
          <div className="stack">
            <h2 className="h2">{L.md(L.isoToDn(result.date))} 기록을 적었습니다</h2>
            {result.fx.length === 0 && <div className="card"><div className="note">{result.count}가지를 적었습니다.</div></div>}
            {result.fx.map((f, i) => (
              <div className={'card' + (f.type === 'count' ? '' : ' dark')} key={i} style={{ gap: 2 }}>
                <div className="result-big" style={f.type === 'count' ? { color: f.over || f.full ? 'var(--danger)' : 'var(--green)' } : null}>{f.text}</div>
                <div className="result-sub">{f.sub}</div>
                <div className="small" style={f.type === 'count' ? null : { color: 'var(--mist)' }}>{f.note}</div>
              </div>
            ))}
          </div>
        )}

        <div className="card" style={{ gap: 16 }}>
          <div className="field"><label htmlFor="r-date">뿌린 날</label><input id="r-date" type="date" className="input" value={date} max={L.dnToIso(today + 1)} onChange={(e) => setDate(e.target.value)} /></div>
          {prefill && prefill.items.length > 0 && (
            <div className="field">
              <span className="flabel">{prefill.title}에서 한 일</span>
              <div className="stack" style={{ gap: 0 }}>
                {prefill.items.map((it) => (
                  <div className="row h" key={it.key}>
                    <div className="main"><span style={{ fontFamily: 'var(--serif)', fontWeight: 900, fontSize: 24, color: 'var(--green)', lineHeight: 1.25 }}>{it.tree}</span><span style={{ fontSize: 17, fontWeight: 700 }}>{it.product || it.text}</span>{it.buy && <span className="small">아직 없는 약이라 꺼 두었습니다</span>}</div>
                    <button type="button" className={'toggle' + (off[it.key] ? '' : ' on')} role="switch" aria-checked={!off[it.key]} aria-label={it.tree + ' ' + (it.product || it.text) + ' 했음'} onClick={() => setOff(Object.assign({}, off, { [it.key]: !off[it.key] }))}></button>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div className="field">
            <span className="flabel">{prefill ? '더 뿌린 나무' : '나무'}</span>
            <div className="chips wrap">
              <button type="button" className={'pick' + (trees.length === data.trees.length ? ' on' : '')} aria-pressed={trees.length === data.trees.length} onClick={() => setTrees(trees.length === data.trees.length ? [] : data.trees.map((t) => t.name))}>전체</button>
              {data.trees.map((t) => <button type="button" key={t.name} className={'pick' + (trees.indexOf(t.name) >= 0 ? ' on' : '')} aria-pressed={trees.indexOf(t.name) >= 0} onClick={() => flip(trees, setTrees, t.name)}>{t.name}</button>)}
            </div>
          </div>
          <div className="field">
            <span className="flabel">{prefill ? '더 뿌린 약' : '약'}</span>
            <div className="chips wrap">{options.map((p) => <button type="button" key={p.name} className={'pick' + (prods.indexOf(p.name) >= 0 ? ' on' : '')} aria-pressed={prods.indexOf(p.name) >= 0} onClick={() => flip(prods, setProds, p.name)}>{p.name}{p.own && <small>보유</small>}</button>)}</div>
          </div>
          <div className="field"><label htmlFor="r-water">물 양 (적지 않아도 됨)</label><div className="numrow"><input id="r-water" className="input num" inputMode="decimal" value={water} onChange={(e) => setWater(e.target.value.replace(/[^0-9.]/g, ''))} /><span className="unit">L</span></div></div>
          {pairs.length > 0 && <div className="small">저장할 기록: {pairs.map((p) => p.tree + ' ' + p.product).join(', ')}</div>}
          <button type="button" className="btn" disabled={!canSave} onClick={save}>저장</button>
        </div>

        {harvest.length > 0 && (
          <div className="stack">
            <h2 className="h2">딸 수 있는 날</h2>
            {harvest.map((h) => (
              <div className="card dark" key={h.tree} style={{ gap: 2 }}>
                <div className="result-big">{L.md(h.date)}부터</div>
                <div className="result-sub">{h.tree}</div>
                <div className="small" style={{ color: 'var(--mist)' }}>{h.product} · 수확 {h.phi}일 전까지</div>
              </div>
            ))}
          </div>
        )}

        {counts.length > 0 && (
          <div className="stack">
            <h2 className="h2">올해 쓴 횟수</h2>
            <div className="card tight">
              {counts.map((c, i) => (
                <div className="row h" key={i}>
                  <div className="main"><span style={{ fontSize: 17, fontWeight: 700 }}>{c.tree} · {c.product}</span>{c.max !== null && <span className="small">한 해 {c.max}회까지</span>}</div>
                  <span className="amount" style={{ fontSize: 28, color: c.max !== null && c.n >= c.max ? 'var(--danger)' : 'var(--green)' }}>{c.n}회</span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="stack">
          <h2 className="h2">올해 기록</h2>
          {logs.length === 0 && <div className="card"><div className="note">아직 기록이 없습니다.</div></div>}
          {logs.length > 0 && (
            <div className="card tight">
              {logs.map((g) => (
                <div className="row h" key={g.id}>
                  <div className="main"><span style={{ fontSize: 17, fontWeight: 700 }}>{g.tree} · {g.product}</span><span className="small">{L.md(L.isoToDn(g.date))}{g.water ? ' · 물 ' + g.water + 'L' : ''}</span></div>
                  <TwoStep label="삭제" onGo={() => onDeleteLog(g.id)} />
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

function CalcScreen({ data, ctx, go }) {
  const [water, setWater] = useState(20);
  const [custom, setCustom] = useState('');
  const w = L.num(custom) || water;
  const rows = useMemo(() => L.calcRows(data, ctx, w), [data, ctx, w]);
  const have = rows.filter((r) => !r.missing);
  const miss = rows.filter((r) => r.missing);
  const mix = useMemo(() => L.mixTable(data, ctx), [data, ctx]);
  return (
    <React.Fragment>
      <div className="hero">
        <div className="hero-col"><div className="eyebrow">희석 용량</div><h1>계산기</h1><div className="hero-sub">물 양을 고르면 약마다 넣을 양이 나옵니다.</div></div>
        <div className="water">
          {[5, 10, 20].map((v) => <button type="button" key={v} className={!L.num(custom) && water === v ? 'on' : ''} aria-pressed={!L.num(custom) && water === v} onClick={() => { setWater(v); setCustom(''); }}>{v}L</button>)}
        </div>
      </div>
      <div className="body">
        <div className="card">
          <div className="field"><label htmlFor="c-water">다른 물 양</label><div className="numrow"><input id="c-water" className="input num" inputMode="decimal" value={custom} onChange={(e) => setCustom(e.target.value.replace(/[^0-9.]/g, ''))} placeholder={String(water)} /><span className="unit">L</span></div></div>
        </div>
        <div className="stack">
          {have.map((r, i) => (
            <div className="card" key={i} style={{ padding: '14px 18px', flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                <div className="line"><span className={r.state === 'buy' ? 'pname soft' : 'pname'}>{r.name}</span>{r.state !== 'buy' && <span className="chip own">보유</span>}{r.state === 'alt' && <span className="chip alt">대체</span>}</div>
                <div className="small">{r.rate}{r.trees ? ' · ' + r.trees : ''}{r.label ? ' · 라벨 확인함' : ''}</div>
              </div>
              <div className="amount">{r.amount || '라벨대로'}</div>
            </div>
          ))}
          {miss.length > 0 && (
            <div className="card" style={{ padding: '14px 18px', flexDirection: 'row', justifyContent: 'space-between', alignItems: 'center', gap: 12 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 }}>
                <div className="pname soft">{miss.map((r) => r.name).join(' · ')}</div>
                <div className="small">배수를 아직 확인하지 못했습니다. 라벨 사진을 올리면 채워집니다.</div>
              </div>
              <button type="button" className="btn gold" onClick={() => go('kit')}>올리기</button>
            </div>
          )}
        </div>
        <div className="stack">
          <h2 className="h2">한 통에 섞어도 되나</h2>
          <div className="card tight">
            {mix.map((m) => (
              <div className="row" key={m.id}>
                <div className="between"><span style={{ fontSize: 17, fontWeight: 700 }}>{m.a} + {m.b}</span><MixChip verdict={m.verdict} /></div>
                {m.note && <div className="small">{m.note}</div>}
              </div>
            ))}
          </div>
          <div className="hint">표에 없는 짝은 확인되지 않은 것입니다. 라벨의 혼용표를 보거나 따로 뿌리세요.</div>
        </div>
      </div>
    </React.Fragment>
  );
}

function VideoSheet({ data, init, onSave, onDelete, onClose, toast }) {
  const [tree, setTree] = useState(init.tree || L.ALL_TREES);
  const [url, setUrl] = useState(init.url || '');
  const [title, setTitle] = useState(init.title || '');
  const [memo, setMemo] = useState(init.memo || '');
  const info = L.videoInfo(url);
  const names = data.trees.map((t) => t.name).concat([L.ALL_TREES]);
  if (names.indexOf(tree) < 0) names.push(tree);
  const ok = info.ok && title.trim().length > 0;
  const paste = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t && t.trim()) setUrl(L.pickUrl(t)); else toast('복사해 둔 링크가 없습니다.');
    } catch (e) { toast('붙여넣기가 막혀 있습니다. 링크 칸을 길게 눌러 붙여 넣으세요.'); }
  };
  const canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
  return (
    <div className="veil" onClick={onClose}>
      <div className="sheet" role="dialog" aria-modal="true" aria-label={init.id ? '영상 고치기' : '영상 추가'} onClick={(e) => e.stopPropagation()}>
        <h2>{init.id ? '영상 고치기' : '영상 추가'}</h2>
        <div className="card" style={{ gap: 16 }}>
          <div className="field">
            <span className="flabel">어느 나무</span>
            <div className="chips wrap">
              {names.map((n) => <button type="button" key={n} className={'pick' + (tree === n ? ' on' : '')} aria-pressed={tree === n} onClick={() => setTree(n)}>{n}</button>)}
            </div>
          </div>
          <div className="field">
            <label htmlFor="v-link">링크</label>
            <div className="line" style={{ flexWrap: 'nowrap' }}>
              <input id="v-link" className="input" style={{ fontSize: 16, minWidth: 0, flex: 1 }} type="url" inputMode="url" value={url} onChange={(e) => setUrl(e.target.value)} onBlur={() => { if (url.trim()) setUrl(L.pickUrl(url)); }} placeholder="유튜브에서 복사한 링크" autoComplete="off" autoCapitalize="off" />
              {canPaste && <button type="button" className="btn gold" style={{ minHeight: 50 }} onClick={paste}>붙여넣기</button>}
            </div>
            {info.kind === 'youtube' && (
              <div className="line" style={{ flexWrap: 'nowrap', marginTop: 4 }}>
                <span className="vthumb sm"><img src={info.thumb} alt="" loading="lazy" onError={(e) => { e.currentTarget.style.display = 'none'; }} /></span>
                <span className="green-note">유튜브 영상입니다. 앱 안에서 바로 볼 수 있습니다.</span>
              </div>
            )}
            {info.kind === 'link' && <div className="green-note">유튜브가 아닌 링크입니다. 누르면 새 창으로 열립니다.</div>}
            {info.kind === 'bad' && url.trim().length > 0 && <div className="warn-note">http로 시작하는 주소를 넣어 주세요.</div>}
          </div>
          <div className="field"><label htmlFor="v-title">제목 (내가 붙이는 이름)</label><input id="v-title" className="input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="예: 가을철 전정법" autoComplete="off" /></div>
          <div className="field"><label htmlFor="v-memo">메모 (비워 둬도 됨)</label><input id="v-memo" className="input" value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="예: 10월에 볼 것" autoComplete="off" /></div>
        </div>
        <button type="button" className="btn" disabled={!ok} onClick={() => onSave({ id: init.id || '', added: init.added || '', tree: tree, url: L.pickUrl(url), title: title, memo: memo })}>저장</button>
        <div className="between">
          <button type="button" className="btn line2" style={{ flex: 1 }} onClick={onClose}>닫기</button>
          {init.id && <TwoStep label="지우기" onGo={() => onDelete(init.id)} />}
        </div>
        <div className="small" style={{ padding: '0 4px' }}>저장하면 구글 시트의 영상 탭에 한 줄이 생깁니다. 시트에서 직접 적어도 똑같이 보입니다.</div>
      </div>
    </div>
  );
}

function VideoCard({ v, playing, onPlay, onEdit }) {
  const info = L.videoInfo(v.url);
  const title = v.title || '제목 없음';
  if (info.kind !== 'youtube') {
    return (
      <div className="card vlinkcard">
        {info.ok ? (
          <a className="vlink" href={info.url} target="_blank" rel="noopener noreferrer">
            <span className="linkicon"><Icon name="link" size={26} bold /></span>
            <span className="vtext">
              <span className="pname" style={{ fontSize: 19 }}>{title}</span>
              <span className="small">{(v.memo ? v.memo + ' · ' : '') + (info.host || '링크') + ' · 새 창으로 열림'}</span>
            </span>
          </a>
        ) : (
          <div className="vtext">
            <span className="pname" style={{ fontSize: 19 }}>{title}</span>
            <span className="warn-note">링크가 비었거나 http로 시작하지 않아 열 수 없습니다.</span>
          </div>
        )}
        <button type="button" className="btn ghost" onClick={onEdit}>고치기</button>
      </div>
    );
  }
  return (
    <div className="card" style={{ padding: 12 }}>
      {playing ? (
        <iframe className="vframe" src={info.embed} title={title} allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerPolicy="strict-origin-when-cross-origin" allowFullScreen></iframe>
      ) : (
        <button type="button" className="vthumb" aria-label={title + ' 재생'} onClick={onPlay}>
          <img src={info.thumb} alt="" loading="lazy" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
          <span className="vplay"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z"></path></svg></span>
        </button>
      )}
      <div className="between" style={{ alignItems: 'flex-start', padding: '0 4px 2px 4px' }}>
        <div className="vtext">
          <span className="pname">{title}</span>
          {v.memo && <span className="small">{v.memo}</span>}
          {playing && <a className="small" href={info.watch} target="_blank" rel="noopener noreferrer" style={{ fontWeight: 700, textDecoration: 'underline', textUnderlineOffset: 4 }}>안 나오면 유튜브에서 열기</a>}
        </div>
        <button type="button" className="btn ghost" onClick={onEdit}>고치기</button>
      </div>
    </div>
  );
}

function VideoScreen({ data, tree, setTree, onSave, onDelete, toast }) {
  const [playing, setPlaying] = useState('');
  const [edit, setEdit] = useState(null);
  const groups = useMemo(() => L.videoGroups(data), [data]);
  const g = tree ? groups.filter((x) => x.name === tree)[0] || { name: tree, list: [], count: 0 } : null;
  const save = (v) => { onSave(v); setEdit(null); };
  const del = (id) => { onDelete(id); setEdit(null); if (playing === id) setPlaying(''); };
  const sheet = edit && <VideoSheet data={data} init={edit} onSave={save} onDelete={del} onClose={() => setEdit(null)} toast={toast} />;
  if (g) {
    const yt = g.list.filter((v) => L.videoInfo(v.url).kind === 'youtube').length;
    return (
      <React.Fragment>
        <div className="hero" style={{ gap: 6 }}>
          <button type="button" className="vback" onClick={() => { setTree(''); setPlaying(''); window.scrollTo(0, 0); }}><Icon name="left" size={20} bold />영상</button>
          <div className="hero-top">
            <h1 className={g.name.length > 3 ? 'mid' : ''}>{g.name}</h1>
            <div className="hero-side" style={{ paddingBottom: 10 }}>{g.count ? '영상 ' + yt + '개' + (g.count > yt ? ' · 링크 ' + (g.count - yt) + '개' : '') : '아직 없음'}</div>
          </div>
        </div>
        <div className="body" style={{ gap: 12 }}>
          {g.list.length === 0 && <div className="card"><div className="note">아직 올린 영상이 없습니다. 유튜브에서 링크를 복사해 추가해 보세요.</div></div>}
          {g.list.map((v) => <VideoCard key={v.id} v={v} playing={playing === v.id} onPlay={() => setPlaying(v.id)} onEdit={() => setEdit(Object.assign({}, v, { tree: L.videoTree(data, v) }))} />)}
          <button type="button" className="btn" style={{ marginTop: 8 }} onClick={() => setEdit({ tree: g.name })}><Icon name="plus" size={22} bold />{g.name + ' 영상 추가'}</button>
        </div>
        {sheet}
      </React.Fragment>
    );
  }
  return (
    <React.Fragment>
      <div className="hero">
        <div className="hero-col">
          <div className="eyebrow">나무별 참고 영상</div>
          <h1>영상</h1>
          <div className="hero-sub">나무를 누르면 모아 둔 영상이 나옵니다.</div>
        </div>
      </div>
      <div className="body" style={{ gap: 12 }}>
        <div className="stack folds">
          {groups.map((x) => (
            <button type="button" key={x.name} className={'vtree' + (x.name === L.ALL_TREES ? ' all' : '')} onClick={() => { setTree(x.name); window.scrollTo(0, 0); }}>
              <span className="fold-main">
                <span className="tree-name mid">{x.name}</span>
                <span className="fold-sub">{x.sub}</span>
              </span>
              {x.count > 0 && <span className="chip tagc" style={{ fontSize: 15, padding: '3px 12px' }}>{x.count}개</span>}
              <span className="chev"><Icon name="right" bold /></span>
            </button>
          ))}
        </div>
        <button type="button" className="btn" style={{ marginTop: 8 }} onClick={() => setEdit({ tree: L.ALL_TREES })}><Icon name="plus" size={22} bold />영상 추가</button>
      </div>
      {sheet}
    </React.Fragment>
  );
}

function recentDiag(data, tree, today) {
  const g = L.diagsOf(data, tree)[0];
  if (!g) return null;
  const d = L.isoToDn(g.date);
  return d !== null && today - d <= 60 ? g : null;
}

const DIAG_SLOTS = ['가까이', '잎 전체', '잎 뒷면'];
const LIKELY = { '높음': 'alt', '보통': 'tagc', '낮음': 'buy' };

function LikelyChip({ v, big }) {
  if (!v) return null;
  return <span className={'chip ' + (LIKELY[v] || 'buy')} style={big ? { fontSize: 15, padding: '3px 12px' } : undefined}>{'가능성 ' + v}</span>;
}

function Dots({ list }) {
  return (list || []).filter(Boolean).map((t, i) => <div className="dotline" key={i}><span className="dot"></span><span>{t}</span></div>);
}

function DiagScreen({ data, ctx, today, diag, setDiag, busy, onRun, onSave, onRetake, onDelete, onPhotos, openSaved, go }) {
  const camRef = useRef(null), albRef = useRef(null);
  const [sel, setSel] = useState(0);
  useEffect(() => { setSel(0); }, [diag && diag.result]);
  const trees = data.trees.map((t) => t.name);
  const r = diag.result;
  if (!r) {
    const past = L.diagsOf(data, diag.tree).slice(0, 5);
    const left = 3 - diag.photos.length;
    return (
      <React.Fragment>
        <div className="hero" style={{ gap: 8 }}>
          <button type="button" className="vback" onClick={() => go('main')}><Icon name="left" size={20} bold />이번 달</button>
          <div className="eyebrow">사진으로 병 찾기</div>
          <h1 className="mid">{diag.tree || '어느 나무?'}</h1>
          <div className="hero-sub">병든 잎이나 벌레를 찍어 올리면 무슨 병인지, 무슨 벌레인지 판단합니다.</div>
        </div>
        <div className="body" style={{ gap: 16 }}>
          <div className="card">
            <div className="cap">어느 나무</div>
            <div className="chips wrap">
              {trees.map((t) => <button type="button" key={t} className={'pick' + (diag.tree === t ? ' on' : '')} aria-pressed={diag.tree === t} onClick={() => setDiag(Object.assign({}, diag, { tree: t }))}>{t}</button>)}
            </div>
          </div>
          <div className="card">
            <div className="cap">사진 (1~3장)</div>
            <PhotoInputs camRef={camRef} albRef={albRef} onFiles={onPhotos} />
            <div className="thumbs">
              {DIAG_SLOTS.map((name, i) => {
                const p = diag.photos[i];
                return (
                  <div className="slot" key={i}>
                    {p ? (
                      <div className="thumb diag">
                        {p.thumb ? <img src={p.thumb} alt={name + ' 사진'} /> : <div className="center" style={{ minHeight: 0, height: '100%', padding: 8, fontSize: 13 }}>미리 보기 없음</div>}
                        <button type="button" className="x" aria-label="사진 빼기" disabled={busy} onClick={() => setDiag(Object.assign({}, diag, { photos: diag.photos.filter((x) => x.id !== p.id) }))}><Icon name="x" size={18} bold /></button>
                      </div>
                    ) : (
                      <button type="button" className="slot-add" disabled={busy || i > diag.photos.length} onClick={() => camRef.current.click()}><Icon name="camera" size={26} />찍기</button>
                    )}
                    <span className="small" style={{ textAlign: 'center' }}>{name}</span>
                  </div>
                );
              })}
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button type="button" className="btn line2" style={{ flex: '1 1 0' }} disabled={busy || left <= 0} onClick={() => camRef.current.click()}><Icon name="camera" size={22} />사진 찍기</button>
              <button type="button" className="btn line2" style={{ flex: '1 1 0' }} disabled={busy || left <= 0} onClick={() => albRef.current.click()}><Icon name="album" size={22} />앨범에서</button>
            </div>
            <div className="small">증상을 가까이 한 장, 잎이나 가지 전체 한 장, 잎 뒷면 한 장이 있으면 덜 틀립니다. 벌레는 손가락이나 동전을 옆에 두고 찍으면 크기를 압니다.</div>
          </div>
          <div className="card">
            <label className="cap" htmlFor="d-note">본 것 (비워 둬도 됨)</label>
            <textarea id="d-note" className="input area" rows={3} value={diag.note} placeholder="예: 잎에 갈색 점이 생기고 가운데가 떨어져 구멍이 났어요" onChange={(e) => setDiag(Object.assign({}, diag, { note: e.target.value }))}></textarea>
          </div>
          {diag.readError && <div className="banner bad">{diag.readError}</div>}
          <div className="stack">
            <button type="button" className="btn" disabled={busy || !diag.tree || diag.photos.length === 0} onClick={onRun}>
              {busy ? <React.Fragment><span className="spin"></span>판단하는 중입니다</React.Fragment> : '판단 받기'}
            </button>
            <div className="hint">{busy ? '사진을 올리고 Gemini가 봅니다. 20초에서 1분쯤 걸립니다. 화면을 닫지 마세요.' : !diag.tree ? '나무를 먼저 골라 주세요.' : '사진은 구글 드라이브의 진단 사진 폴더에 저장되고 Gemini가 판단합니다. 사진만으로는 틀릴 수 있습니다.'}</div>
          </div>
          {past.length > 0 && (
            <div className="stack">
              <h2 className="h2" style={{ fontSize: 24 }}>{diag.tree ? diag.tree + ' 지난 진단' : '지난 진단'}</h2>
              <div className="card tight">
                {past.map((g) => (
                  <button type="button" key={g.id} className="diag-last row-btn" onClick={() => openSaved(g)}>
                    <span className="diag-mini">{g.thumb && <img src={g.thumb} alt="" />}</span>
                    <span className="vtext">
                      <span className="cap">{L.md(L.isoToDn(g.date))}{diag.tree ? '' : ' · ' + g.tree}</span>
                      <span className="pname" style={{ fontSize: 18 }}>{g.name || '판단 못 함'}</span>
                    </span>
                    {g.likely && <LikelyChip v={g.likely} />}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      </React.Fragment>
    );
  }
  const cands = Array.isArray(r.candidates) ? r.candidates.filter((c) => c && c.name) : [];
  const ok = r.status === 'ok' && cands.length > 0;
  const cur = ok ? cands[Math.min(sel, cands.length - 1)] : null;
  const drugs = cur ? L.diagDrugs(data, ctx, diag.tree, cur.name, today) : [];
  const noSpray = cur && /약해|생리|기타/.test(cur.type || '');
  const when = diag.date ? L.md(L.isoToDn(diag.date)) : L.md(today);
  const others = cands.map((c, i) => ({ c: c, i: i })).filter((x) => x.i !== sel);
  return (
    <React.Fragment>
      <div className="hero" style={{ gap: 8 }}>
        <button type="button" className="vback" onClick={diag.saved ? () => go('main') : onRetake}><Icon name="left" size={20} bold />{diag.saved ? '이번 달' : '사진 다시'}</button>
        <div className="eyebrow">판단 결과 · {diag.tree} · {when}</div>
        <h1 className="mid" style={cur && cur.name.length > 6 ? { fontSize: 40 } : undefined}>{cur ? cur.name : '판단하기 어려움'}</h1>
        {cur && <div className="line"><LikelyChip v={cur.likely} big />{cur.type && <span className="hero-sub" style={{ fontSize: 15 }}>{cur.type}</span>}<span className="hero-sub" style={{ fontSize: 15 }}>사진 {(diag.fileIds || []).length || diag.photos.length}장으로 판단</span></div>}
        {diag.photos.some((p) => p.thumb) && (
          <div className="thumbs" style={{ marginTop: 6 }}>
            {diag.photos.filter((p) => p.thumb).map((p) => p.fileId
              ? <a key={p.id} className="thumb sm" href={'https://drive.google.com/file/d/' + p.fileId + '/view'} target="_blank" rel="noopener" aria-label="사진 크게 보기"><img src={p.thumb} alt="" /></a>
              : <span key={p.id} className="thumb sm"><img src={p.thumb} alt="" /></span>)}
          </div>
        )}
      </div>
      <div className="body" style={{ gap: 14 }}>
        {r.demo && <div className="banner">예시 결과입니다. 실제 사진은 보지 않았습니다. 시트와 Gemini를 연결하면 사진을 보고 판단합니다.</div>}
        {!ok && (
          <div className="card">
            <div className="cap">사진으로 판단하지 못했습니다</div>
            <div style={{ fontSize: 17 }}>{r.message || '증상이 또렷하게 보이는 사진으로 다시 찍어 주세요.'}</div>
            {r.photoTip && <div className="note">{r.photoTip}</div>}
          </div>
        )}
        {cur && (
          <div className="card">
            <div className="cap">왜 그렇게 봤나</div>
            <Dots list={cur.reasons} />
            {(cur.checks || []).length > 0 && <div className="cap" style={{ marginTop: 6 }}>직접 확인해 볼 것</div>}
            <Dots list={cur.checks} />
          </div>
        )}
        {cur && (
          <div className="card">
            <div className="vtext">
              <div className="cap">이 병에 쓰는 약 ({diag.tree} 등록)</div>
              <div className="small">앱의 약량표에서 고른 것입니다. Gemini가 고른 약이 아닙니다.</div>
            </div>
            {drugs.length === 0 && <div className="note" style={{ color: 'var(--text)' }}>{noSpray ? '약으로 고칠 일이 아닙니다. 아래 할 일을 먼저 해 보세요.' : '앱의 약량표에는 ' + diag.tree + '의 ' + cur.name + '에 쓰는 약이 없습니다. 약을 쓰려면 농약사나 농업기술센터에서 ' + diag.tree + '에 등록된 약인지 확인하세요.'}</div>}
            {drugs.map((d) => (
              <div className="drug" key={d.product}>
                <div className="line"><span className="pname" style={{ fontSize: 19 }}>{d.name}</span><StateChips res={{ state: d.state }} /></div>
                {d.state === 'alt' && <div className="green-note">계획의 {L.josa(d.product, '과', '와')} 같은 약입니다.</div>}
                <div className={d.now ? 'when now' : 'when'}>{d.when}</div>
                {d.info.line && <div className="small">{d.info.line}</div>}
                <div className="small">라벨의 대상: {d.target}</div>
              </div>
            ))}
          </div>
        )}
        {ok && (r.care || []).length > 0 && (
          <div className="card">
            <div className="cap">약 없이 할 일</div>
            <Dots list={r.care} />
          </div>
        )}
        {ok && others.length > 0 && (
          <div className="card">

  );
}

function useStore() {
  const [raw, setRaw] = useState(() => (DEMO ? (LS.get('tree.demo', null) || clone(SEED)) : LS.get('tree.cache', null)));
  const [status, setStatus] = useState(() => LS.get('tree.status', null));
  const [net, setNet] = useState(DEMO ? 'demo' : 'loading');
  const [netMsg, setNetMsg] = useState('');
  const [pending, setPending] = useState(() => (DEMO ? 0 : LS.get('tree.queue', []).length));
  const rawRef = useRef(raw);
  const queueRef = useRef(DEMO ? [] : LS.get('tree.queue', []));
  const busy = useRef(false);
  const again = useRef('');

  const saveRaw = (next) => { rawRef.current = next; setRaw(next); LS.set(DEMO ? 'tree.demo' : 'tree.cache', next); };
  const saveQueue = (q) => { queueRef.current = q; LS.set('tree.queue', q); setPending(q.length); };

  async function sync(full) {
    if (DEMO) return;
    if (busy.current) { if (full || !again.current) again.current = full ? 'full' : 'ops'; return; }
    busy.current = true;
    try {
      let wantLoad = full;
      for (let guard = 0; guard < 6; guard++) {
        const sending = queueRef.current.slice();
        if (sending.length) {
          setNet('saving');
          await api('ops', { ops: sending });
          saveQueue(queueRef.current.slice(sending.length));
          continue;
        }
        if (!wantLoad) break;
        const r = await api('load');
        wantLoad = false;
        saveRaw(queueRef.current.length ? L.applyOps(r.tables, queueRef.current) : r.tables);
        setStatus(r.status); LS.set('tree.status', r.status);
        if (r.missing && r.missing.length) { setNet('setup'); setNetMsg('없는 시트: ' + r.missing.join(', ')); return; }
      }
      setNet('ok'); setNetMsg('');
    } catch (e) {
      if (e.code === 'PIN') { setNet('pin'); setNetMsg(LS.get('tree.pin', '') ? e.message : ''); }
      else if (e.code === 'SETUP') { setNet('setup'); setNetMsg(e.message); }
      else if (e.server) {
        saveQueue([]);
        setNet('error'); setNetMsg(e.message);
        try { const r = await api('load'); saveRaw(r.tables); setStatus(r.status); } catch (e2) {}
      } else { setNet('offline'); setNetMsg(e.message || ''); }
    } finally {
      busy.current = false;
      if (again.current) { const f = again.current === 'full'; again.current = ''; sync(f); }
    }
  }

  function commit(ops) {
    if (!ops || !ops.length) return;
    saveRaw(L.applyOps(rawRef.current || {}, ops));
    if (!DEMO) { saveQueue(queueRef.current.concat(ops)); sync(false); }
  }

  async function setSearch(on) {
    const r = await api('setSetting', { key: 'SEARCH', value: on ? 'on' : 'off' });
    setStatus(r.status); LS.set('tree.status', r.status);
  }

  function resetDemo() { LS.del('tree.demo'); saveRaw(clone(SEED)); }

  useEffect(() => {
    if (DEMO) return undefined;
    sync(true);
    const on = () => sync(true);
    const vis = () => { if (document.visibilityState === 'visible') sync(true); };
    window.addEventListener('online', on);
    document.addEventListener('visibilitychange', vis);
    return () => { window.removeEventListener('online', on); document.removeEventListener('visibilitychange', vis); };
  }, []);

  return { raw, rawRef, status, net, netMsg, pending, sync, commit, setSearch, resetDemo };
}

function App() {
  const store = useStore();
  const [tab, setTab] = useState('main');
  const [draft, setDraft] = useState(null);
  const [reading, setReading] = useState(false);
  const [prefill, setPrefill] = useState(null);
  const [openTrees, setOpenTrees] = useState({});
  const [videoTree, setVideoTree] = useState('');
  const [diag, setDiag] = useState(null);
  const [diagBusy, setDiagBusy] = useState(false);
  const [sheet, setSheet] = useState('');
  const [toastMsg, setToastMsg] = useState('');
  const [today, setToday] = useState(nowDn());
  const data = useMemo(() => (store.raw ? L.normalize(store.raw) : null), [store.raw]);
  const ctx = useMemo(() => (data ? L.buildOwn(data) : null), [data]);

  useEffect(() => {
    const id = setInterval(() => { const n = nowDn(); setToday((t) => (t === n ? t : n)); }, 60000);
    return () => clearInterval(id);
  }, []);
  useEffect(() => {
    if (!toastMsg) return undefined;
    const id = setTimeout(() => setToastMsg(''), 4200);
    return () => clearTimeout(id);
  }, [toastMsg]);
  const toast = (m) => setToastMsg(m);
  const go = (t) => { if (t === 'video' && tab === 'video') setVideoTree(''); setTab(t); window.scrollTo(0, 0); };

  if (store.net === 'pin') return <PinGate store={store} />;
  if (!data) {
    return (
      <div className="app"><div className="center">
        {store.net === 'loading' || store.net === 'saving' ? <React.Fragment><div className="spin" style={{ borderColor: 'rgba(18,58,44,0.25)', borderTopColor: 'var(--green)' }}></div><div className="note">불러오는 중입니다</div></React.Fragment> : (
          <React.Fragment>
            <div className="pname">시트에서 내용을 가져오지 못했습니다.</div>
            <div className="note">{store.netMsg || '연결을 확인해 주세요.'}</div>
            <button type="button" className="btn" onClick={() => store.sync(true)}>다시 시도</button>
          </React.Fragment>
        )}
      </div></div>
    );
  }

  const iso = L.dnToIso(today);
  const afterData = (ops) => { const nd = L.normalize(L.applyOps(store.rawRef.current, ops)); return { nd: nd, nctx: L.buildOwn(nd) }; };

  const onToggle = (o) => {
    const t = o.task;
    if (o.doneDate) { store.commit(L.uncheckOps(data, o.key)); toast(t.tree + ' · ' + (t.product || t.text) + ': 완료 표시를 지웠습니다.'); return; }
    if (SPRAY[t.kind] && t.product) {
      const pair = { tree: t.tree, product: L.resolve(ctx, t.product).name, base: t.product, key: o.key };
      const ops = L.logOps(data, [pair], iso, '', '');
      const a = afterData(ops);
      store.commit(ops);
      const fx = L.logEffects(a.nd, a.nctx, [pair], iso, today).filter((f) => f.type !== 'count' || f.full || f.over)[0];
      toast(t.tree + ' · ' + pair.product + ': 오늘 뿌린 것으로 적었습니다.' + (fx ? ' ' + fx.text + ' ' + fx.sub + (fx.type === 'count' ? ' (' + fx.note + ')' : '') : ''));
    } else {
      store.commit([{ table: 'checks', type: 'put', row: { id: o.key, date: iso } }]);
      toast(t.tree + ' · ' + (t.product || t.text) + ': 끝낸 일로 표시했습니다.');
    }
  };

  const onVisitRecord = (v) => {
    const items = v.items.filter((x) => !x.doneDate).map((x) => {
      const t = x.task;
      const spray = SPRAY[t.kind] && t.product;
      const res = L.resolve(ctx, t.product);
      return { key: x.key, tree: t.tree, product: spray ? res.name : '', base: spray ? t.product : '', buy: !!spray && res.state === 'buy', text: t.product && !spray ? t.product + ' · ' + t.text : t.text };
    });
    const vlo = L.fromDn(v.lo), vhi = L.fromDn(v.hi);
    setPrefill({ title: vlo.m + '월 ' + (v.lo === v.hi ? vlo.d : vlo.d + '–' + vhi.d) + '일 방문', items: items });
    go('record');
  };

  const onSaveRecord = (pairs, extra, date, water) => {
    let ops = L.logOps(data, pairs, date, L.num(water) || '', '');
    extra.forEach((x) => ops.push({ table: 'checks', type: 'put', row: { id: x.key, date: date } }));
    const a = afterData(ops);
    store.commit(ops);
    return L.logEffects(a.nd, a.nctx, pairs, date, today);
  };

  const onPhotos = async (files, kitId, append) => {
    try {
      const room = 8 - (append && draft ? draft.photos.length : 0);
      if (files.length > room) toast('한 번에 8장까지 올릴 수 있습니다. 앞의 ' + Math.max(room, 0) + '장만 넣었습니다.');
      const photos = [];
      for (const f of files.slice(0, Math.max(room, 0))) photos.push(await fileToPhoto(f));
      if (append && draft) setDraft(Object.assign({}, draft, { photos: draft.photos.concat(photos), result: null }));
      else setDraft({ kitId: kitId || null, photos: photos, result: null });
      if (tab !== 'check') go('check');
    } catch (e) { toast(e.message || '사진을 준비하지 못했습니다.'); }
  };

  const onRead = async () => {
    if (!draft || reading) return;
    setReading(true);
    try {
      let r;
      if (DEMO) { await sleep(900); r = { photos: draft.photos.map(() => ({ fileId: '' })), label: demoLabel(draft, data), search: null, sources: [], warnings: [], readError: '', model: '', demo: true }; }
      else {
        r = await api('readLabel', {
          photos: draft.photos.map((p) => (p.fileId ? { fileId: p.fileId } : { data: p.data, mime: p.mime })),
          crops: data.trees.map((t) => t.aliases.join('/'))
        });
      }
      const photos = draft.photos.map((p, i) => {
        const fid = (r.photos && r.photos[i] && r.photos[i].fileId) || p.fileId;
        return Object.assign({}, p, { fileId: fid, data: fid ? '' : p.data });
      });
      const kit = draft.kitId ? data.kit.filter((k) => k.id === draft.kitId)[0] : null;
      const label = r.label || { name: kit ? kit.name : '', ingredient: kit ? kit.ingredient : '', content: kit ? kit.content : '', form: kit ? kit.form : '', rows: [], cautions: [] };
      if (kit && !label.name) label.name = kit.name;
      const cmp = L.compareLabel(data, label, r.search);
      setDraft({
        kitId: draft.kitId, photos: photos,
        result: {
          ident: cmp.ident, unit: cmp.unit || (kit ? kit.unit : ''), covers: kit ? kit.covers : '',
          rows: cmp.rows.map((x) => Object.assign({}, x, { use: x.onLabel })),
          cautions: label.cautions || [], unreadable: label.unreadable || [], maker: label.maker || '', group: label.group || '',
          sources: r.sources || [], searchNotes: (r.search && r.search.notes) || '', warnings: r.warnings || [], readError: r.readError || '', model: r.model || '', demo: !!r.demo
        }
      });
      window.scrollTo(0, 0);
    } catch (e) {
      if (e.code === 'PIN') store.sync(true);
      toast(e.server ? e.message : '연결이 안 되어 라벨을 읽지 못했습니다. 다시 눌러 주세요.');
    } finally { setReading(false); }
  };

  const onConfirm = () => {
    const res = draft.result;
    const name = (res.ident.name || '').trim();
    if (!name) { toast('약 이름을 적어 주세요.'); return; }
    const c = L.confirmOps(data, {
      kitId: draft.kitId, name: name, ingredient: (res.ident.ingredient || '').trim(), content: (res.ident.content || '').trim(), form: (res.ident.form || '').trim(),
      unit: res.unit, covers: res.covers, rows: res.rows.filter((r) => r.use), cautions: res.cautions, maker: res.maker, group: res.group, model: res.model, sources: res.sources,
      photos: draft.photos.map((p) => ({ id: p.id, fileId: p.fileId, thumb: p.thumb }))
    }, iso);
    store.commit(c.ops);
    setDraft(null);
    go('kit');
    toast(L.josa(name, '을', '를') + ' 내 약에 넣고 계획에 반영했습니다.');
  };

  const onCancelDraft = () => {
    const ids = draft ? draft.photos.map((p) => p.fileId).filter(Boolean) : [];
    if (ids.length && !DEMO) api('delPhotos', { fileIds: ids }).catch(() => {});
    setDraft(null);
    go('kit');
  };

  const onAddName = (k) => {
    if (data.kit.some((x) => L.norm(x.name) === L.norm(k.name))) { toast('이미 내 약에 있습니다.'); return; }
    store.commit([{ table: 'kit', type: 'put', row: { id: L.uid('k'), name: k.name, ingredient: k.ingredient || '', content: k.content || '', form: k.form || '', unit: '', covers: k.covers || '', status: '확인 전', checked: '', label: '', added: iso } }]);
    setSheet('');
    toast(L.josa(k.name, '을', '를') + ' 내 약에 넣었습니다.');
  };

  const onRemoveKit = (id) => {
    const r = L.removeKitOps(data, id);
    store.commit(r.ops);
    if (r.fileIds.length && !DEMO) api('delPhotos', { fileIds: r.fileIds }).catch(() => {});
    toast('내 약에서 뺐습니다.');
  };

  const onSaveVideo = (v) => {
    store.commit(L.videoOps(v, iso));
    setVideoTree(L.videoTree(data, v));
    toast(L.josa(v.title.trim(), '을', '를') + (v.id ? ' 고쳤습니다.' : ' 영상에 넣었습니다.'));
  };
  const trashUnsaved = (d) => {
    if (d && !d.saved && d.fileIds && d.fileIds.length && !DEMO) api('delPhotos', { fileIds: d.fileIds }).catch(() => {});
  };
  const onDiag = (tree) => {
    trashUnsaved(diag);
    setDiag({ tree: tree || '', photos: [], note: '', result: null, fileIds: [], model: '', readError: '', saved: false });
    go('diag');
  };
  const openSavedDiag = (g) => {
    trashUnsaved(diag);
    const det = g.detail || {};
    setDiag({ id: g.id, tree: g.tree, date: g.date, note: g.note, photos: g.thumb ? [{ id: 'saved', thumb: g.thumb, fileId: g.fileIds[0] || '' }] : [], result: det.result || { status: 'unclear', message: '자세한 내용이 저장되지 않았습니다.', candidates: [] }, fileIds: g.fileIds, model: det.model || '', readError: '', saved: true });
    go('diag');
  };
  const onDiagPhotos = async (files) => {
    try {
      const room = 3 - diag.photos.length;
      if (files.length > room) toast('사진은 3장까지입니다. 앞의 ' + Math.max(room, 0) + '장만 넣었습니다.');
      const add = [];
      for (const f of files.slice(0, Math.max(room, 0))) add.push(await fileToPhoto(f));
      setDiag((d) => Object.assign({}, d, { photos: d.photos.concat(add), readError: '' }));
    } catch (e) { toast(e.message || '사진을 준비하지 못했습니다.'); }
  };
  const onDiagRun = async () => {
    if (!diag || diagBusy || !diag.tree || !diag.photos.length) return;
    setDiagBusy(true);
    const old = diag.fileIds || [];
    try {
      let r;
      if (DEMO) { await sleep(900); r = { photos: diag.photos.map(() => ({ fileId: '' })), result: demoDiag(data, diag.tree), model: '', readError: '' }; }
      else {
        const t = data.trees.filter((x) => x.name === diag.tree)[0];
        r = await api('diagnose', {
          tree: diag.tree, aliases: t ? t.aliases : [], date: iso, note: diag.note,
          photos: diag.photos.map((p) => ({ data: p.data, mime: p.mime })),
          candidates: L.diagCandidates(data, diag.tree)
        });
        if (old.length) api('delPhotos', { fileIds: old }).catch(() => {});
      }
      const fileIds = (r.photos || []).map((x) => x.fileId).filter(Boolean);
      const photos = diag.photos.map((p, i) => Object.assign({}, p, { fileId: (r.photos && r.photos[i] && r.photos[i].fileId) || '' }));
      if (!r.result) { setDiag(Object.assign({}, diag, { photos: photos, fileIds: fileIds, readError: r.readError || '판단하지 못했습니다. 다시 눌러 주세요.' })); return; }
      setDiag(Object.assign({}, diag, { photos: photos, fileIds: fileIds, result: r.result, model: r.model || '', date: iso, readError: '' }));
      window.scrollTo(0, 0);
    } catch (e) {
      if (e.code === 'PIN') store.sync(true);
      if (e.server && /모르는 요청/.test(e.message)) toast('서버가 예전 버전입니다. Apps Script에서 Code.gs를 바꾸고 새 버전으로 배포해 주세요.');
      else toast(e.server ? e.message : '연결이 안 되어 판단하지 못했습니다. 다시 눌러 주세요.');
    } finally { setDiagBusy(false); }
  };
  const onDiagSave = () => {
    const id = L.uid('d');
    const thumb = (diag.photos[0] && diag.photos[0].thumb) || '';
    store.commit(L.diagOps({ id: id, tree: diag.tree, result: diag.result, model: diag.model, note: diag.note, fileIds: diag.fileIds, thumb: thumb }, diag.date || iso, iso));
    setDiag(Object.assign({}, diag, { id: id, saved: true }));
    setOpenTrees({ [diag.tree]: true });
    go('main');
    toast(diag.tree + ' 진단을 기록에 남겼습니다.');
  };
  const onDiagRetake = () => {
    if (diag.saved) { onDiag(diag.tree); return; }
    setDiag(Object.assign({}, diag, { result: null, readError: '' }));
    window.scrollTo(0, 0);
  };
  const onDiagDelete = () => {
    store.commit([{ table: 'diags', type: 'del', id: diag.id }]);
    if (diag.fileIds && diag.fileIds.length && !DEMO) api('delPhotos', { fileIds: diag.fileIds }).catch(() => {});
    setDiag(null);
    go('main');
    toast('진단 기록을 지웠습니다.');
  };

  const onDeleteVideo = (id) => { store.commit([{ table: 'videos', type: 'del', id: id }]); toast('영상을 지웠습니다.'); };

  const navTab = tab === 'check' ? 'kit' : tab === 'diag' ? 'main' : tab;
  const NAV = [['main', '이번 달', 'cal'], ['ahead', '앞으로', 'list'], ['kit', '내 약', 'bottle'], ['record', '기록', 'pen'], ['calc', '계산기', 'drop'], ['video', '영상', 'play']];
  return (
    <div className="app">
      {tab === 'main' && <MainScreen store={store} data={data} ctx={ctx} today={today} go={go} onToggle={onToggle} onVisitRecord={onVisitRecord} openSettings={() => setSheet('settings')} openTrees={openTrees} setOpenTrees={setOpenTrees} onDiag={onDiag} openSavedDiag={openSavedDiag} />}
      {tab === 'diag' && diag && <DiagScreen data={data} ctx={ctx} today={today} diag={diag} setDiag={setDiag} busy={diagBusy} onRun={onDiagRun} onSave={onDiagSave} onRetake={onDiagRetake} onDelete={onDiagDelete} onPhotos={onDiagPhotos} openSaved={openSavedDiag} go={go} />}
      {tab === 'ahead' && <AheadScreen data={data} ctx={ctx} today={today} />}
      {tab === 'kit' && <KitScreen data={data} ctx={ctx} today={today} onPhotos={onPhotos} onAddName={onAddName} onRemove={onRemoveKit} onCheckKit={(id) => { setDraft({ kitId: id, photos: data.photos.filter((p) => p.kitId === id && p.fileId).map((p) => ({ id: p.id, data: '', mime: 'image/jpeg', thumb: p.thumb, fileId: p.fileId })), result: null }); go('check'); }} openNameSheet={() => setSheet('name')} />}
      {tab === 'check' && <CheckScreen data={data} draft={draft} setDraft={setDraft} reading={reading} onRead={onRead} onConfirm={onConfirm} onCancel={onCancelDraft} onPhotos={onPhotos} go={go} status={store.status} />}
      {tab === 'record' && <RecordScreen data={data} ctx={ctx} today={today} prefill={prefill} clearPrefill={() => setPrefill(null)} onSave={onSaveRecord} onDeleteLog={(id) => { store.commit(L.deleteLogOps(data, id)); toast('기록을 지웠습니다.'); }} />}
      {tab === 'calc' && <CalcScreen data={data} ctx={ctx} go={go} />}
      {tab === 'video' && <VideoScreen data={data} tree={videoTree} setTree={setVideoTree} onSave={onSaveVideo} onDelete={onDeleteVideo} toast={toast} />}
      <nav className="nav" aria-label="메뉴">
        <div className="nav-in">
          {NAV.map((n) => (
            <button type="button" key={n[0]} className={navTab === n[0] ? 'on' : ''} aria-current={navTab === n[0] ? 'page' : undefined} onClick={() => go(n[0])}>
              <Icon name={n[2]} bold={navTab === n[0]} />{n[1]}
            </button>
          ))}
        </div>
      </nav>
      {sheet === 'settings' && <SettingsSheet store={store} onClose={() => setSheet('')} toast={toast} />}
      {sheet === 'name' && <NameSheet data={data} onAdd={onAddName} onClose={() => setSheet('')} />}
      {toastMsg && <div className="toast" role="status">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
